<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pirate Watch · Starlab</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%232f6fdb'/%3E%3Cpath d='M18 40c4-10 9-16 14-16s10 6 14 16' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='22' r='5' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --ink: #16191d; --ink-2: #5b6470; --line: #dde1e6;
  --accent: #2f6fdb; --accent-ink: #ffffff; --ok: #1f9d55; --warn: #c98a00; --bad: #d64545; --unk: #8a94a0;
  --ok-bg: #e5f6ec; --warn-bg: #fdf3dc; --bad-bg: #fbe7e7; --unk-bg: #eef0f3; --acc-bg: #e6eefc;
  --heat: 47, 111, 219;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --ink: #e8ebef; --ink-2: #9aa4b0; --line: #2d333d;
    --accent: #5b8ff0; --ok: #3fbf74; --warn: #e3a72a; --bad: #f06a6a; --unk: #7d8794;
    --ok-bg: #16301f; --warn-bg: #33290f; --bad-bg: #3a1a1a; --unk-bg: #242a33; --acc-bg: #1c2a44;
    --heat: 91, 143, 240;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --ink: #e8ebef; --ink-2: #9aa4b0; --line: #2d333d;
  --accent: #5b8ff0; --ok: #3fbf74; --warn: #e3a72a; --bad: #f06a6a; --unk: #7d8794;
  --ok-bg: #16301f; --warn-bg: #33290f; --bad-bg: #3a1a1a; --unk-bg: #242a33; --acc-bg: #1c2a44;
  --heat: 91, 143, 240;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 16px; }
.top h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.top .home { color: var(--ink-2); text-decoration: none; font-size: 13px; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; min-height: 36px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 3px 9px; font-size: 12.5px; min-height: 28px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px; min-width: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 0 0 10px; font-weight: 650; }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }
.tag { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--unk-bg);
  color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); } .tag.acc { background: var(--acc-bg); color: var(--accent); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--bad);
  background: var(--bad-bg); border-radius: 99px; padding: 2px 9px 2px 7px; white-space: nowrap; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
.banner { padding: 9px 12px; border-radius: 8px; font-size: 13px; }
.banner.err { background: var(--bad-bg); color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }

/* status */
.status { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; align-items: start; }
.state { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.state .big { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; margin-top: 12px; }
.facts div { min-width: 0; }
.facts dt { font-size: 11.5px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.facts dd { margin: 1px 0 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; max-width: 220px; }
.bar > span { display: block; height: 100%; background: var(--ok); }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.ctl select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 8px; min-height: 36px; }
@media (max-width: 640px) { .status { grid-template-columns: 1fr; } .ctl { justify-content: flex-start; } }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.filters label { display: grid; gap: 3px; font-size: 12px; color: var(--ink-2); min-width: 0; }
.filters input[type=text], .filters input[type=date], .filters select {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 8px; min-height: 36px; color: var(--ink); }
.filters input[type=text] { width: 190px; max-width: 100%; }
.filters .check { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink); min-height: 36px; }
.filters .check input { width: 18px; height: 18px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); color: var(--accent);
  background: var(--acc-bg); border-radius: 99px; padding: 3px 4px 3px 10px; font-size: 12.5px; font-weight: 600; }
.chip button { border: 0; background: none; color: inherit; border-radius: 50%; width: 22px; height: 22px; line-height: 1; padding: 0; }
@media (max-width: 640px) { .filters label { flex: 1 1 140px; } .filters input[type=text] { width: 100%; } }

/* hits */
.hits { display: grid; gap: 10px; }
.hit { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.hit.new { animation: flash 2s ease-out; }
@keyframes flash { from { background: var(--acc-bg); } to { background: transparent; } }
.hit .h1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.hit .f { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hit .t { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink-2); }
.hit .m { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hit .m b { color: var(--ink); font-weight: 600; }
.hit .tx { border-left: 3px solid var(--line); padding: 1px 0 1px 9px; overflow-wrap: anywhere; }
.hit .tx.en { border-left-color: var(--accent); }
.hit .tx .lbl { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; display: block; }
.hit audio { width: 100%; max-width: 460px; height: 36px; }
.hit .note { font-size: 12px; color: var(--ink-2); }
.more { display: flex; justify-content: center; margin-top: 10px; }
.empty { padding: 18px 4px; color: var(--ink-2); }

/* heatmap */
.hmhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.hmhead select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 8px; min-height: 32px; }
.hmscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 8px; max-height: 560px; overflow-y: auto; }
table.hm { border-collapse: separate; border-spacing: 0; font-size: 11.5px; font-variant-numeric: tabular-nums; }
table.hm th, table.hm td { padding: 0; text-align: center; }
table.hm thead th { position: sticky; top: 0; background: var(--panel); z-index: 2; color: var(--ink-2); font-weight: 600;
  height: 24px; min-width: 26px; border-bottom: 1px solid var(--line); }
table.hm th.ch { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: right; padding: 0 8px;
  white-space: nowrap; font-weight: 600; border-right: 1px solid var(--line); }
table.hm thead th.ch { z-index: 3; }
table.hm td.c { width: 26px; height: 24px; border-right: 1px solid var(--panel); border-bottom: 1px solid var(--panel); }
table.hm td.c button { width: 100%; height: 100%; border: 0; padding: 0; background: transparent; color: transparent; display: block; }
table.hm td.c button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
table.hm td.c.sel button { outline: 2px solid var(--bad); outline-offset: -2px; }
table.hm td.tot { padding: 0 8px; color: var(--ink-2); white-space: nowrap; text-align: right; }
.legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 70px; height: 9px; border-radius: 3px;
  background: linear-gradient(90deg, rgba(var(--heat), .08), rgba(var(--heat), 1)); }

/* ignore list */
table.list { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.list th { text-align: left; font-size: 11.5px; color: var(--ink-2); font-weight: 600; text-transform: uppercase;
  letter-spacing: .04em; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
table.list td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.listscroll { max-height: 340px; overflow: auto; }
details > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary h2 { margin: 0; }
details > summary::after { content: "▸"; color: var(--ink-2); margin-left: auto; transition: transform .15s; }
details[open] > summary::after { transform: rotate(90deg); }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
@media (max-width: 760px) { .cols2 { grid-template-columns: 1fr; } }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.signin { max-width: 560px; margin: 40px auto; }
@media (max-width: 640px) { .wrap { padding: 12px; gap: 12px; } .panel { padding: 12px; } .top { padding: 8px 12px; } }
</style>
</head>
<body>
<header class="top">
  <a class="home" href="/rf" title="Back to Starlab">← Starlab</a>
  <h1>Pirate Watch</h1>
  <span class="live" id="live" hidden></span>
  <span class="spacer"></span>
  <span class="muted small" id="updated"></span>
</header>
<div id="app"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const STATES = {
  sweeping: ["Running", "ok", "Sweeping 243–270 MHz for voice bursts"],
  learning: ["Learning", "acc", "Learning the band's steady carriers; detection already runs on a provisional baseline"],
  recording: ["Recording", "bad", "Recording a burst"],
  blocked: ["Blocked", "bad", ""], released: ["Released", "warn", ""], waiting: ["Waiting", "warn", ""],
  error: ["Error", "bad", ""], stopped: ["Stopped", "", "The watch is shutting down or stopped"],
  starting: ["Starting", "acc", ""],
};
const STATUS_TAG = {speech: ["speech", "ok"], no_speech: ["no speech", ""], missed: ["missed", "warn"],
  pending: ["transcribing…", "acc"], recording: ["recording", "bad"], error: ["error", "bad"]};
const S = {status: null, down: null, signin: false, hits: [], more: false, loading: false, heat: null, ignored: null,
  f: readFilters(), seen: new Set(), firstLoad: true};

function readFilters() {
  const q = new URLSearchParams(location.search);
  return {speech: q.get("speech") !== "0", freq: q.get("f") || "", from: q.get("from") || "", to: q.get("to") || "",
    ch: q.get("ch") ? Number(q.get("ch")) : null, hr: q.get("hr") !== null && q.get("hr") !== "" ? Number(q.get("hr")) : null,
    metric: q.get("metric") || "detections"};
}
function writeFilters() {
  const f = S.f, q = new URLSearchParams();
  if (!f.speech) q.set("speech", "0");
  if (f.freq) q.set("f", f.freq);
  if (f.from) q.set("from", f.from);
  if (f.to) q.set("to", f.to);
  if (f.ch !== null) q.set("ch", f.ch);
  if (f.hr !== null) q.set("hr", f.hr);
  if (f.metric !== "detections") q.set("metric", f.metric);
  history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : ""));
}

async function api(path, opts = {}) {
  const r = await fetch(path, {credentials: "same-origin", ...opts,
    headers: {"Content-Type": "application/json", "X-AOBS-RF": "1", ...(opts.headers || {})}});
  if (r.status === 401) { S.signin = true; render(); throw new Error("not signed in"); }
  const body = await r.json().catch(() => ({}));
  if (r.status === 503 && body.watch_down) { const e = new Error(body.error); e.down = true; throw e; }
  if (!r.ok) throw new Error(body.detail || body.error || `HTTP ${r.status}`);
  return body;
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

// ------------------------------------------------------------ formatting
const mhz = (hz) => hz == null ? "—" : (hz / 1e6).toFixed(4);
const parseT = (s) => s ? new Date(s) : null;
function utc(d) { return d ? d.toISOString().slice(0, 19).replace("T", " ") + "Z" : "—"; }
function local(d) {
  return d ? d.toLocaleString(undefined, {month: "short", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit", timeZoneName: "short"}) : "";
}
function dur(s) {
  if (s == null) return "—";
  if (s < 60) return `${s.toFixed(1)} s`;
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return `${m} min ${r} s`;
}
function since(d) {
  if (!d) return "—";
  let s = Math.max(0, (Date.now() - d.getTime()) / 1000);
  const days = Math.floor(s / 86400); s -= days * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60);
  return days ? `${days} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`;
}
function ago(d) {
  if (!d) return "";
  const s = Math.round((Date.now() - d.getTime()) / 1000);
  return s < 60 ? `${Math.max(0, s)} s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`;
}

// ------------------------------------------------------------ filters -> query
function freqRange(text) {
  const t = text.replace(/\s+/g, "").replace(/mhz$/i, "");
  if (!t) return {};
  const m = t.match(/^(\d+(?:\.\d+)?)(?:[-–](\d+(?:\.\d+)?))?$/);
  if (!m) return {bad: true};
  const a = Number(m[1]) * 1e6, b = m[2] ? Number(m[2]) * 1e6 : null;
  if (b === null) return {min_hz: Math.round(a - 2500), max_hz: Math.round(a + 2500)};   // one 5 kHz channel
  return {min_hz: Math.round(Math.min(a, b)), max_hz: Math.round(Math.max(a, b))};
}
function dateRange() {
  const f = S.f, out = {};
  if (f.from) out.since = new Date(f.from + "T00:00:00").toISOString();
  if (f.to) { const d = new Date(f.to + "T00:00:00"); d.setDate(d.getDate() + 1); out.until = d.toISOString(); }
  return out;
}
function hitsQuery(before) {
  const f = S.f, q = new URLSearchParams({speech: f.speech ? "1" : "0", limit: "50"});
  const fr = freqRange(f.freq);
  if (fr.min_hz) { q.set("min_hz", fr.min_hz); q.set("max_hz", fr.max_hz); }
  const dr = dateRange();
  if (dr.since) q.set("since", dr.since);
  if (dr.until) q.set("until", dr.until);
  if (f.ch !== null) q.set("channel_hz", f.ch);
  if (f.hr !== null) q.set("hour", f.hr);
  if (before) q.set("before", before);
  return q.toString();
}
function heatQuery() {
  const dr = dateRange(), q = new URLSearchParams();
  q.set("since", dr.since || new Date(Date.now() - 7 * 86400e3).toISOString());
  if (dr.until) q.set("until", dr.until);
  return q.toString();
}

// ------------------------------------------------------------ loading
async function loadStatus() {
  try {
    const st = await api("/v1/piratewatch");
    const changed = !S.status || JSON.stringify(st.hits) !== JSON.stringify(S.status.hits);
    S.status = st; S.down = null;
    renderStatus();
    if (changed && !S.firstLoad) { refreshHits(); loadHeat(); }
  } catch (e) {
    if (e.down) { S.down = e.message; S.status = null; renderStatus(); }
    else if (!S.signin) console.warn(e);
  }
  $("updated").textContent = "updated " + new Date().toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit", second: "2-digit"});
}
async function loadHits(append) {
  if (S.loading) return;
  if (freqRange(S.f.freq).bad) { S.hits = []; S.more = false; renderHits("Frequency: type MHz, like 260.2545 or 260.2-260.3"); return; }
  S.loading = true;
  try {
    const before = append && S.hits.length ? S.hits[S.hits.length - 1].id : null;
    const r = await api("/v1/piratewatch/hits?" + hitsQuery(before));
    S.hits = append ? S.hits.concat(r.hits) : r.hits;
    S.more = r.more;
    if (S.firstLoad) r.hits.forEach((h) => S.seen.add(h.id));
    if (append) r.hits.forEach((h) => S.seen.add(h.id));
    renderHits();
    S.firstLoad = false;
  } catch (e) { if (!e.down && !S.signin) renderHits(e.message); else renderHits(); }
  finally { S.loading = false; }
}
async function refreshHits() {
  // new hits arrive at the top; known ones may have changed (transcribed). Keep any older pages already loaded.
  if (freqRange(S.f.freq).bad) return;
  try {
    const r = await api("/v1/piratewatch/hits?" + hitsQuery(null));
    const byId = new Map(r.hits.map((h) => [h.id, h]));
    const lowest = r.hits.length ? r.hits[r.hits.length - 1].id : Infinity;
    const older = S.hits.filter((h) => h.id < lowest && !byId.has(h.id));
    S.hits = r.hits.concat(older);
    if (!older.length) S.more = r.more;
    renderHits();
  } catch (e) { /* the status line already says why */ }
}
async function loadHeat() {
  try { S.heat = await api("/v1/piratewatch/heatmap?" + heatQuery()); renderHeat(); }
  catch (e) { if (!e.down) { S.heat = {error: e.message}; renderHeat(); } }
}
async function loadIgnored() {
  try { S.ignored = await api("/v1/piratewatch/ignored"); renderIgnored(); }
  catch (e) { if (!e.down) { S.ignored = {error: e.message}; renderIgnored(); } }
}
function reloadAll() { writeFilters(); renderChips(); S.firstLoad = true; loadHits(false); loadHeat(); }

// ------------------------------------------------------------ rendering
function render() {
  if (S.signin) {
    $("app").innerHTML = `<div class="wrap"><div class="panel signin"><h2>Sign in</h2><p>This page needs a sign-in link. On the
      computer Starlab runs on, run <code>starlab web-link</code> and open the link it prints, then come back to
      <code>/piratewatch</code>.</p></div></div>`;
    return;
  }
  $("app").innerHTML = `<div class="wrap">
    <section class="panel"><div class="status"><div id="status" style="min-width:0"></div><div class="ctl" id="ctl"></div></div></section>
    <section class="panel">
      <h2>Hits</h2>
      <div class="filters">
        <label class="check" style="display:flex"><input type="checkbox" id="f-speech"> Speech only</label>
        <label>Frequency (MHz)<input type="text" id="f-freq" inputmode="decimal" placeholder="260.2545 or 260.2-260.3" autocomplete="off"></label>
        <label>From<input type="date" id="f-from"></label>
        <label>To<input type="date" id="f-to"></label>
        <button class="btn" id="f-clear">Clear</button>
      </div>
      <div class="chips" id="chips"></div>
      <p class="muted small" id="f-note" style="margin:8px 0 0"></p>
      <div class="hits" id="hits" style="margin-top:12px"></div>
      <div class="more" id="more"></div>
    </section>
    <section class="panel">
      <div class="hmhead">
        <h2 style="margin:0">Activity by channel and UTC hour</h2>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <select id="f-metric" aria-label="Heatmap measure">
            <option value="detections">Detections</option><option value="seconds">Seconds on the air</option><option value="speech">Speech clips</option>
          </select>
          <span class="legend">less <i></i> more</span>
        </div>
      </div>
      <p class="muted small" id="hm-note" style="margin:0 0 8px"></p>
      <div id="heat"></div>
    </section>
    <details class="panel" id="ign-box">
      <summary><h2>What the watch is ignoring</h2><span class="tag" id="ign-count"></span></summary>
      <div id="ignored"></div>
    </details>
  </div>`;
  const f = S.f;
  $("f-speech").checked = f.speech; $("f-freq").value = f.freq; $("f-from").value = f.from; $("f-to").value = f.to;
  $("f-metric").value = f.metric;
  $("f-speech").onchange = (e) => { f.speech = e.target.checked; reloadAll(); };
  let timer = null;
  $("f-freq").oninput = (e) => { clearTimeout(timer); timer = setTimeout(() => { f.freq = e.target.value.trim(); reloadAll(); }, 450); };
  $("f-from").onchange = (e) => { f.from = e.target.value; reloadAll(); };
  $("f-to").onchange = (e) => { f.to = e.target.value; reloadAll(); };
  $("f-clear").onclick = () => { Object.assign(f, {speech: true, freq: "", from: "", to: "", ch: null, hr: null}); render(); reloadAll(); };
  $("f-metric").onchange = (e) => { f.metric = e.target.value; writeFilters(); renderHeat(); };
  $("chips").onclick = (e) => {
    const b = e.target.closest("[data-unset]");
    if (!b) return;
    if (b.dataset.unset === "cell") { f.ch = null; f.hr = null; }
    reloadAll();
  };
  $("hits").onclick = (e) => {
    const b = e.target.closest("[data-chan]");
    if (b) { f.freq = mhz(Number(b.dataset.chan)); $("f-freq").value = f.freq; reloadAll(); }
  };
  $("heat").onclick = (e) => {
    const b = e.target.closest("[data-cell]");
    if (!b) return;
    const [ch, hr] = b.dataset.cell.split(":").map(Number);
    if (f.ch === ch && f.hr === hr) { f.ch = null; f.hr = null; } else { f.ch = ch; f.hr = hr; f.speech = false; $("f-speech").checked = false; }
    reloadAll();
    if (f.ch !== null) $("hits").scrollIntoView({behavior: "smooth", block: "start"});
  };
  if (location.hash === "#ignored") $("ign-box").open = true;
  renderStatus(); renderChips(); renderHits(); renderHeat(); renderIgnored();
}

function renderStatus() {
  const box = $("status"), ctl = $("ctl"), live = $("live");
  if (!box) return;
  const st = S.status;
  if (!st) {
    live.hidden = true; ctl.innerHTML = ""; ctl.dataset.key = "";
    box.innerHTML = S.down ? `<div class="state"><span class="big">Not running</span><span class="tag bad">down</span></div>
      <p class="banner err" style="margin:10px 0 0">${esc(S.down)}</p><p class="muted small">The hit log and clips are on
      the watch's side, so they show again once it is back.</p>` : `<p class="muted">Loading…</p>`;
    return;
  }
  const [label, cls, blurb] = STATES[st.state] || [st.state || "Unknown", "", ""];
  const rec = st.state === "recording";
  const recMhz = st.recording_hz ? mhz(st.recording_hz) : ((st.detail || "").match(/^(\d+\.\d+) MHz/) || [])[1];
  live.hidden = !rec;
  live.textContent = rec ? (recMhz ? `LIVE ${recMhz} MHz` : "LIVE") : "";
  document.title = (rec ? "● LIVE · " : "") + "Pirate Watch · Starlab";
  const b = st.baseline || {};
  const pct = b.of ? Math.min(100, Math.round(100 * (b.learned || 0) / b.of)) : 0;
  const h = st.hits || {};
  const total = Object.values(h).reduce((a, n) => a + n, 0);
  const sweep = st.last_sweep || {};
  const releasedUntil = st.released_until ? parseT(st.released_until) : null;
  box.innerHTML = `<div class="state"><span class="big">${esc(label)}</span>
      ${rec ? `<span class="live">${esc(live.textContent)}</span>` : cls && st.state !== "sweeping" ? `<span class="tag ${cls}">${esc(st.state)}</span>` : ""}</div>
    <div class="muted" style="margin-top:4px;overflow-wrap:anywhere">${esc(st.detail || blurb)}</div>
    <dl class="facts">
      <div><dt>Receiver</dt><dd>${esc(st.receiver)} ${st.lease_held ? `<span class="tag ok">leased</span>` : `<span class="tag">not leased</span>`}</dd></div>
      <div><dt>Uptime</dt><dd>${esc(since(parseT(st.started_at)))}</dd></div>
      <div><dt>Baseline</dt><dd>${pct >= 100 ? "learned" : `${b.learned || 0} / ${b.of || "?"} sweeps`}${b.excluded_ranges != null ? ` · ${b.excluded_ranges} ignored` : ""}
        <div class="bar" title="${pct}%"><span style="width:${pct}%"></span></div></dd></div>
      <div><dt>Last sweep</dt><dd>${sweep.at ? `${esc(ago(parseT(sweep.at)))} · floor ${esc(sweep.median_db)} dB` : "—"}</dd></div>
      <div><dt>Hits</dt><dd>${h.speech || 0} speech · ${total} total</dd></div>
      <div><dt>Released</dt><dd>${st.released ? (releasedUntil ? `until ${esc(local(releasedUntil))}` : "until resumed") : "no"}</dd></div>
    </dl>`;
  // the controls are rebuilt only when release state changes, so a chosen duration (or an open menu) survives polling
  const key = `${st.released}:${st.receiver}`;
  if (ctl.dataset.key === key) return;
  ctl.dataset.key = key;
  ctl.innerHTML = st.released ? `<button class="btn primary" id="resume">Resume watch</button>` : `
    <select id="rel-min" aria-label="Release for">
      <option value="30">30 min</option><option value="60" selected>1 hour</option><option value="120">2 hours</option>
      <option value="240">4 hours</option><option value="0">Until resumed</option>
    </select>
    <button class="btn" id="release" title="Stop the watch and free ${esc(st.receiver)} for SDR++ server">Release ${esc(st.receiver)}</button>`;
  const rb = $("release"), rs = $("resume");
  if (rb) rb.onclick = async () => {
    const minutes = Number($("rel-min").value);
    rb.disabled = true; rb.textContent = "Releasing…";
    try {
      const r = await api("/v1/piratewatch/release", {method: "POST", body: JSON.stringify({minutes})});
      toast(r.confirmed ? `${st.receiver} is free${minutes ? ` for ${minutes >= 60 ? minutes / 60 + " h" : minutes + " min"}` : " until you resume"}` : (r.note || "Release requested"));
    } catch (e) { toast("Release failed: " + e.message); }
    ctl.dataset.key = "";
    loadStatus();
  };
  if (rs) rs.onclick = async () => {
    rs.disabled = true; rs.textContent = "Resuming…";
    try { const r = await api("/v1/piratewatch/resume", {method: "POST", body: "{}"}); toast(r.note || "Resuming"); }
    catch (e) { toast("Resume failed: " + e.message); }
    ctl.dataset.key = "";
    loadStatus();
  };
}

function renderChips() {
  const box = $("chips");
  if (!box) return;
  const f = S.f;
  box.innerHTML = f.ch !== null ? `<span class="chip">${esc(mhz(f.ch))} MHz · ${String(f.hr).padStart(2, "0")}:00–${String(f.hr).padStart(2, "0")}:59 UTC
    <button data-unset="cell" aria-label="Clear the heatmap cell filter">×</button></span>` : "";
  const keep = S.status ? S.status.no_speech_keep_h : 24;
  $("f-note").textContent = f.speech ? "Showing speech only. Turn it off to see every detection, including bursts Whisper called non-speech (their audio is kept " + keep + " h) and missed ones."
    : "Showing every detection. Non-speech audio is kept " + keep + " h; missed bursts had no carrier left by the time the receiver tuned, so they have no audio.";
}

function hitCard(h) {
  const [tag, cls] = STATUS_TAG[h.status] || [h.status, ""];
  const at = parseT(h.start_utc || h.detected_at);
  const lang = h.language ? `${h.language}${h.language_prob != null ? ` (${Math.round(h.language_prob * 100)}%)` : ""}` : null;
  const en = h.translation && h.translation !== h.transcript;
  const isNew = !S.seen.has(h.id);
  S.seen.add(h.id);
  return `<article class="hit${isNew ? " new" : ""}">
    <div class="h1"><button class="f btn small" style="font-size:15px" data-chan="${h.channel_hz}" title="Show this channel only">${esc(mhz(h.freq_hz))} MHz</button>
      <span class="tag ${cls}">${esc(tag)}</span>
      <span class="t">${esc(utc(at))}</span><span class="t">${esc(local(at))}</span></div>
    <div class="m"><span>Duration <b>${esc(dur(h.duration_s))}</b></span><span>Peak <b>${h.peak_db != null ? esc(h.peak_db) + " dB" : "—"}</b>${h.snr_db != null ? ` (+${esc(h.snr_db)} dB)` : ""}</span>
      ${h.width_hz ? `<span>Width <b>${Math.round(h.width_hz / 1000)} kHz</b></span>` : ""}${lang ? `<span>Language <b>${esc(lang)}</b></span>` : ""}
      ${h.speech_prob != null ? `<span>Speech <b>${Math.round(h.speech_prob * 100)}%</b></span>` : ""}<span class="muted">#${h.id}</span></div>
    ${h.transcript ? `<div class="tx"><span class="lbl">${h.status === "speech" ? "Transcript" : "What Whisper heard"}</span>${esc(h.transcript)}</div>` : ""}
    ${en ? `<div class="tx en"><span class="lbl">English</span>${esc(h.translation)}</div>` : ""}
    ${h.has_audio ? `<audio controls preload="none" src="/v1/piratewatch/clips/${h.id}"></audio>` : ""}
    ${h.note ? `<div class="note">${esc(h.note)}</div>` : ""}
  </article>`;
}
function renderHits(error) {
  const box = $("hits");
  if (!box) return;
  if (error) { box.innerHTML = `<p class="banner err">${esc(error)}</p>`; $("more").innerHTML = ""; return; }
  if (!S.hits.length) {
    box.innerHTML = `<p class="empty">${S.loading ? "Loading…" : S.down ? "The watch is not answering." :
      S.f.speech ? "No speech hits match. Turn off “Speech only” to see every detection." : "No detections match."}</p>`;
  } else {
    // keep players that are playing: re-render only when the list changed
    const sig = S.hits.map((h) => `${h.id}:${h.status}:${h.has_audio}:${h.transcript ? 1 : 0}`).join(",");
    if (box.dataset.sig !== sig) {
      const playing = [...box.querySelectorAll("audio")].some((a) => !a.paused);
      if (!playing || !box.dataset.sig) { box.innerHTML = S.hits.map(hitCard).join(""); box.dataset.sig = sig; }
    }
  }
  $("more").innerHTML = S.more ? `<button class="btn" id="load-more">Load older hits</button>` : "";
  if (S.more) $("load-more").onclick = () => loadHits(true);
}

function renderHeat() {
  const box = $("heat");
  if (!box) return;
  const g = S.heat, f = S.f;
  if (!g) { box.innerHTML = `<p class="muted">Loading…</p>`; return; }
  if (g.error) { box.innerHTML = `<p class="banner err">${esc(g.error)}</p>`; return; }
  const range = f.from || f.to ? `${f.from || "start"} to ${f.to || "today"} (your dates)` : "the last 7 days";
  $("hm-note").textContent = `Channels with any activity in ${range}, summed per UTC hour of day. Tap a cell to list its hits.`;
  const fr = freqRange(f.freq);
  const chans = fr.min_hz ? g.channels.filter((c) => c.channel_hz >= fr.min_hz - 2500 && c.channel_hz <= fr.max_hz + 2500) : g.channels;
  if (!chans.length) { box.innerHTML = `<p class="empty">No activity in ${esc(range)}${fr.min_hz ? " on these frequencies" : ""}.</p>`; return; }
  const m = f.metric, peak = Math.max(0, ...chans.map((c) => Math.max(...c[m])));
  const unit = m === "seconds" ? " s" : "";
  const head = `<tr><th class="ch">MHz</th>${Array.from({length: 24}, (_, i) => `<th>${String(i).padStart(2, "0")}</th>`).join("")}<th class="ch" style="position:static">Total</th></tr>`;
  const rows = chans.map((c) => `<tr><th class="ch">${esc(mhz(c.channel_hz))}</th>${c[m].map((v, hr) => {
      const a = v > 0 && peak > 0 ? 0.12 + 0.88 * Math.sqrt(v / peak) : 0;
      const sel = f.ch === c.channel_hz && f.hr === hr;
      const tip = `${mhz(c.channel_hz)} MHz, ${String(hr).padStart(2, "0")}:00 UTC: ${c.detections[hr]} detections, ${c.seconds[hr]} s on air, ${c.speech[hr]} speech`;
      return `<td class="c${sel ? " sel" : ""}" style="${a ? `background:rgba(var(--heat),${a.toFixed(2)})` : ""}"><button data-cell="${c.channel_hz}:${hr}" title="${esc(tip)}" aria-label="${esc(tip)}">${v}</button></td>`;
    }).join("")}<td class="tot">${esc(c.totals[m])}${unit}</td></tr>`).join("");
  const prev = box.querySelector(".hmscroll");
  const keep = prev ? prev.scrollLeft : null;
  box.innerHTML = `<div class="hmscroll"><table class="hm"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  const sc = box.querySelector(".hmscroll");
  if (keep !== null) sc.scrollLeft = keep;
  else if (sc.scrollWidth > sc.clientWidth) {   // narrow screen: start with the current UTC hour in view
    const col = sc.querySelectorAll("thead th")[new Date().getUTCHours() + 1];
    if (col) sc.scrollLeft = Math.max(0, col.offsetLeft - sc.clientWidth / 2);
  }
}

function renderIgnored() {
  const box = $("ignored");
  if (!box) return;
  const ig = S.ignored;
  if (!ig) { box.innerHTML = `<p class="muted">Loading…</p>`; return; }
  if (ig.error) { box.innerHTML = `<p class="banner err">${esc(ig.error)}</p>`; return; }
  $("ign-count").textContent = `${ig.learned.length + ig.auto.length} ranges`;
  const span = (r) => `${mhz(r.lo_hz)}–${mhz(r.hi_hz)}`;
  const learned = ig.learned.length ? `<div class="listscroll"><table class="list"><thead><tr><th>MHz</th><th>Width</th><th>Above floor</th></tr></thead><tbody>${
    ig.learned.map((r) => `<tr><td>${esc(span(r))}</td><td>${(r.width_hz / 1000).toFixed(1)} kHz</td><td>${esc(r.duty_pct)}% of sweeps</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="muted small">None${ig.saved ? "" : " yet: the baseline has not been saved (it is saved every 50 sweeps while learning)"}.</p>`;
  const auto = ig.auto.length ? `<div class="listscroll"><table class="list"><thead><tr><th>MHz</th><th>Width</th><th>Masked after</th></tr></thead><tbody>${
    ig.auto.map((r) => `<tr><td>${esc(span(r))}</td><td>${(r.width_hz / 1000).toFixed(1)} kHz</td><td>${r.hit ? `hit #${r.hit.id}, ${esc(local(parseT(r.hit.at)))}` : "a clip that never went quiet"}</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="muted small">None.</p>`;
  box.innerHTML = `<p class="muted small" style="margin:10px 0 0">${ig.complete ? `Learned from ${ig.learned_sweeps} sweeps.` :
      `Provisional: ${ig.learned_sweeps} of ${ig.of} learning sweeps so far; the list settles when learning finishes.`}
    A bin is ignored when it sat more than ${esc(ig.threshold_db ?? 8)} dB above the floor in at least ${esc(ig.duty_mask_pct ?? 50)}% of the learning
    sweeps (steady carriers and receiver spurs), plus one bin either side. Read-only; <code>python -m aobs.piratewatch relearn</code> starts over.</p>
    <div class="cols2"><div><h2>Steady carriers and spurs</h2>${learned}</div><div><h2>Auto-ignored channels</h2>
    <p class="muted small" style="margin:0 0 6px">Channels whose clip never went quiet for ${esc(S.status ? "the maximum clip length" : "a whole clip")}.</p>${auto}</div></div>`;
}

// ------------------------------------------------------------ start
render();
loadStatus().then(() => { loadHits(false); loadHeat(); loadIgnored(); });
setInterval(loadStatus, 5000);
setInterval(() => { if (!document.hidden) loadHeat(); }, 60000);
setInterval(() => { if (!document.hidden) loadIgnored(); }, 120000);
setInterval(() => { if (S.status) renderStatus(); }, 30000);   // uptime and "ago" tick between changes
</script>
</body>
</html>
