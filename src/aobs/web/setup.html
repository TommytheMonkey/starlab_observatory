<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup · Starlab Observatory</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --ink: #16191d; --ink-2: #5b6470; --line: #dde1e6;
  --accent: #2f6fdb; --accent-ink: #ffffff; --ok: #1f9d55; --warn: #c98a00; --bad: #d64545; --unk: #8a94a0;
  --ok-bg: #e5f6ec; --warn-bg: #fdf3dc; --bad-bg: #fbe7e7; --unk-bg: #eef0f3;
  --k-antenna: #2f6fdb; --k-filter: #8b5cf6; --k-amplifier: #e0661b; --k-switch: #0e9488; --k-other: #6b7280;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --ink: #e8ebef; --ink-2: #9aa4b0; --line: #2d333d;
    --accent: #5b8ff0; --ok: #3fbf74; --warn: #e3a72a; --bad: #f06a6a; --unk: #7d8794;
    --ok-bg: #16301f; --warn-bg: #33290f; --bad-bg: #3a1a1a; --unk-bg: #242a33;
    --k-antenna: #5b8ff0; --k-filter: #a68af8; --k-amplifier: #f0884a; --k-switch: #2bb5a7; --k-other: #9aa3ad;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --ink: #e8ebef; --ink-2: #9aa4b0; --line: #2d333d;
  --accent: #5b8ff0; --ok: #3fbf74; --warn: #e3a72a; --bad: #f06a6a; --unk: #7d8794;
  --ok-bg: #16301f; --warn-bg: #33290f; --bad-bg: #3a1a1a; --unk-bg: #242a33;
  --k-antenna: #5b8ff0; --k-filter: #a68af8; --k-amplifier: #f0884a; --k-switch: #2bb5a7; --k-other: #9aa3ad;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, 
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.top img { height: 40px; }
.top .t { font-weight: 650; font-size: 17px; }
.wrap { display: grid; grid-template-columns: 230px 1fr; gap: 16px; max-width: 1100px; margin: 16px auto; padding: 0 16px; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.steps li.current { background: var(--panel); color: var(--ink); font-weight: 650; box-shadow: 0 0 0 1px var(--line); }
.steps li .n { width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; background: var(--unk-bg); flex: none; }
.steps li.done .n { background: var(--ok-bg); color: var(--ok); }
.steps li.skipped .n { background: var(--warn-bg); color: var(--warn); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
h2 { margin: 0 0 6px; font-size: 20px; }
.muted { color: var(--ink-2); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 7px; padding: 8px 10px; font: inherit; }
.field input[type=checkbox], .field input[type=radio] { width: auto; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 13px; font: inherit; font-size: 14px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.nav { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; flex-wrap: wrap; }
.nav .sp { flex: 1; }
.banner { padding: 9px 12px; border-radius: 8px; font-size: 13.5px; margin: 10px 0; }
.banner.ok { background: var(--ok-bg); color: var(--ok); } .banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.err { background: var(--bad-bg); color: var(--bad); } .banner.info { background: var(--unk-bg); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.card .h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--unk-bg); font-weight: 600; }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.fault { background: var(--bad-bg); color: var(--bad); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; } td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
.lv-pass { color: var(--ok); } .lv-warn { color: var(--warn); } .lv-fail { color: var(--bad); } .lv-info { color: var(--ink-2); }
code { background: var(--unk-bg); padding: 1px 5px; border-radius: 5px; }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } .row2, .row3 { grid-template-columns: 1fr; } .steps { display: flex; overflow-x: auto; gap: 4px; } .steps li .l { display: none; } }
</style>
<script src="/ui/integrations.js"></script>

BAHS785n/b49nwNSlAJHiJnPnejP+H6KPc48xbTMGAAAAAElFTkSuQmCC" alt="Starlab Observatory"><span class="t">Setup</span><span style="flex:1"></span><a class="btn small" href="/rf" id="skip-all" hidden>Go to the station page</a></div>
<div class="wrap"><nav><ul class="steps" id="steps"></ul></nav><main class="panel" id="main"><p class="muted">Loading…</p></main></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const W = {state: null, cfg: {}, inv: null, sats: null, busy: false, msg: null};
async function api(path, opts = {}) {
  const r = await fetch(path, {credentials: "same-origin", ...opts, headers: {"Content-Type": "application/json", "X-AOBS-RF": "1", ...(opts.headers || {})}});
  if (r.status === 401) { signin(); throw new Error("not signed in"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || j.detail || r.statusText);
  return j;
}
function signin() {
  $("steps").innerHTML = "";
  $("main").innerHTML = `<h2>Sign in</h2><p>This page needs a sign-in link. On the computer Starlab runs on, run:</p>
    <p><code>starlab web-link</code></p><p class="muted">It prints one link per address this computer can be reached at; open the one that matches how you reach it. Not at that computer? Log in to it with SSH first (see the guide <i>Opening Starlab from another computer</i>). This browser then stays signed in for 30 days. If the Slack integration is set up, it can give you a link too.</p>`;
}
const doc = (name) => W.cfg[name]?.current?.data || {};
async function loadCfg() { const c = await api("/v1/config"); W.cfg = c.documents; W.bootstrap = c.bootstrap; }
async function saveDoc(name, data) {
  const cur = W.cfg[name].current;
  const r = await api(`/v1/config/${name}`, {method: "PUT", body: JSON.stringify({data: {...cur.data, ...data}, base_version: cur.version, note: "setup wizard"})});
  W.cfg[name] = await api(`/v1/config/${name}`);
  return r;
}
async function step(id, action) { W.state = await api("/v1/setup/step", {method: "POST", body: JSON.stringify({step: id, action})}); W.msg = null; render(); window.scrollTo(0, 0); }
function nav(id, {next = "Continue", skip = false, back = true, onNext = null} = {}) {
  const i = W.state.steps.findIndex((s) => s.id === id);
  return `<div class="nav">${back && i > 0 ? `<button class="btn" data-go="${W.state.steps[i - 1].id}">Back</button>` : ""}<span class="sp"></span>
    ${skip ? `<button class="btn" data-skip="${id}">Skip for now</button>` : ""}<button class="btn primary" data-next="${id}">${esc(next)}</button></div>`;
}
const msg = () => W.msg ? `<div class="banner ${W.msg[0]}">${esc(W.msg[1])}</div>` : "";
const MHz = (hz) => hz == null ? "—" : `${(hz / 1e6).toFixed(3)} MHz`;
const local = (iso) => iso ? new Date(iso).toLocaleString(undefined, {weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "";

// ------------------------------------------------------------------ steps
const VIEW = {
  welcome: () => `<h2>Welcome to Starlab Observatory</h2>
    <p>Starlab books, records and decodes satellite passes with software-defined radio receivers, and helps you test the antennas, filters and amplifiers in front of them.</p>
    <p><b>Ways to run it</b></p><ul>
      <li><b>One computer with USB receivers.</b> This setup covers it.</li>
      <li><b>Receivers on other Linux machines</b> over SSH. Add them after setup, under Settings → Receiver hosts.</li>
      <li><b>Simulation.</b> No receiver needed: simulated receivers let you try every workflow. Their recordings are synthetic and labelled as such everywhere.</li></ul>
    <div class="banner info">Nothing records until you book a recording or explicitly enable automatic recording on a receiver that passed a hardware test. You can leave and come back: progress is saved. Everything stays editable later in Settings.</div>
    ${nav("welcome", {next: "Start", back: false})}`,
  identity: () => { const o = doc("observatory"); return `<h2>Your observatory</h2>${msg()}
    <div class="field"><label>Name</label><input id="o-name" value="${esc(o.name)}" maxlength="80"></div>
    <div class="field"><label>Description (optional)</label><input id="o-desc" value="${esc(o.description)}" maxlength="500"></div>
    <div class="field"><label>Time zone (for display; everything is stored in UTC)</label><input id="o-tz" list="tzs" value="${esc(o.timezone && o.timezone !== "UTC" ? o.timezone : Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC")}"><datalist id="tzs">${(Intl.supportedValuesOf ? Intl.supportedValuesOf("timeZone") : []).map((z) => `<option value="${esc(z)}">`).join("")}</datalist></div>
    <div class="row3"><div class="field"><label>Latitude (°, north +)</label><input id="o-lat" type="number" step="any" min="-90" max="90" value="${o.latitude ?? ""}"></div>
      <div class="field"><label>Longitude (°, east +)</label><input id="o-lon" type="number" step="any" min="-180" max="180" value="${o.longitude ?? ""}"></div>
      <div class="field"><label>Elevation (m)</label><input id="o-elev" type="number" step="any" value="${o.elevation_m ?? ""}"></div></div>
    <p class="muted" style="font-size:13px">The location is used to predict passes. It is stored only in this computer's Starlab database and never leaves it (exports include it only if you download one). <button class="btn small" id="geo">Use this browser's location</button></p>
    ${nav("identity", {next: "Save and continue"})}`; },
  hosts: () => `<h2>Receiver hosts</h2>
    <div class="card"><div class="h"><b>This computer</b><span class="tag ok">local USB</span></div><div class="muted" style="font-size:13.5px">Receivers plugged into this computer's USB ports. Starlab needs permission to open USB radios: the installer adds its user to the <code>plugdev</code> group, and <code>--udev</code> installs rules for common SDRs.</div></div>
    <div class="card"><div class="h"><b>Other Linux machines over SSH</b></div><div class="muted" style="font-size:13.5px">Receivers plugged into another Linux computer (for example a Raspberry Pi on the roof) can be added later in Settings → Receiver hosts: key-only SSH, and Starlab records and tests there. See the remote receivers guide.</div></div>
    ${nav("hosts", {skip: true})}`,
  discovery: () => { const sim = !!doc("simulation").enabled; const d = W.inv?.discovered || [];
    return `<h2>Hardware discovery</h2>${msg()}
    <p class="muted" style="font-size:13.5px">Looking reads the USB device list only. It never opens a device, so it cannot disturb a recording.</p>
    <div class="field"><label style="font-weight:400;font-size:14px;color:var(--ink)"><input type="checkbox" id="sim" ${sim ? "checked" : ""}> Simulation mode: also offer simulated receivers (for trying Starlab without hardware)</label></div>
    <button class="btn" id="discover">Look for hardware</button>
    ${W.inv ? (d.length ? `<table style="margin-top:12px"><tr><th>Device</th><th>Serial</th><th>Status</th><th>In use</th></tr>${d.map((x) => `<tr><td>${esc(x.model)}${x.simulated ? ` <span class="tag">simulated</span>` : ""}</td><td>${esc(x.serial || "—")}</td><td>${esc({supported: "supported", driver_missing: "driver not installed", unsupported: "not supported yet", not_a_receiver: "not an IQ receiver", unknown_model: "unknown"}[x.support.status])}<div class="muted" style="font-size:12px">${esc(x.support.detail)}</div></td><td>${esc(x.usage.detail)}</td></tr>`).join("")}</table>`
      : `<div class="banner info">No receivers found on USB. Plug one in and look again, or turn on simulation mode.</div>`) : ""}
    ${nav("discovery", {skip: true})}`; },
  receivers: () => { const v = W.inv; if (!v) return `<p class="muted">Loading…</p>`;
    const fresh = v.discovered.filter((d) => !d.configured_as && d.support.status === "supported");
    const STATE = {verified: ["ok", "Verified"], simulated: ["", "Simulated · no hardware"], configured: ["warn", "Configured · not verified"]};
    return `<h2>Receivers</h2>${msg()}
    <p class="muted" style="font-size:13.5px">Add the receivers Starlab may use, then <b>verify</b> each one: a 10-second test that captures and checks real IQ samples. Only a passed test makes a real receiver <b>Verified</b>. Simulated receivers can only ever be <i>Simulated</i>.</p>
    ${v.receivers.map((r) => { const [c, l] = r.readiness === "failed" ? ["fault", "Configured · last test failed"] : STATE[r.state] || STATE.configured;
      return `<div class="card"><div class="h"><b>${esc(r.name)} · ${esc(r.id)}</b><span class="tag ${c}">${l}</span></div><div class="muted" style="font-size:13px">${esc(r.model || r.driver_label)} · serial ${esc(r.serial)}${r.readiness_detail?.problems?.length ? ` · ${esc(r.readiness_detail.problems[0])}` : ""}</div>
        <div style="margin-top:8px"><button class="btn small primary" data-verify="${esc(r.id)}">${r.state === "configured" ? "Verify" : "Test again"}</button> <span class="muted" data-vstat="${esc(r.id)}" style="font-size:13px"></span></div></div>`; }).join("")}
    ${fresh.map((d, i) => `<div class="card"><div class="h"><b>${esc(d.model)}</b>${d.simulated ? `<span class="tag">simulated</span>` : `<span class="tag">discovered</span>`}</div><div class="muted" style="font-size:13px">serial ${esc(d.serial || "none")} · ${esc(d.usage.detail)}</div>
        ${d.needs_probe && !d.identified?.ok ? `<div style="margin-top:8px"><button class="btn small" data-identify="${esc(d.usb_path)}">Identify</button> <span class="muted" style="font-size:12.5px">Opens it briefly to ask its driver what it supports; refused if anything is using it.</span>${d.identified && !d.identified.ok ? `<div class="banner err">${esc(d.identified.error || (d.identified.problems || []).join("; "))}</div>` : ""}</div>`
        : `<div class="row2" style="margin-top:8px"><div class="field"><label>Receiver ID</label><input data-id="${esc(d.usb_path)}" value="${esc(nextId(v, i))}"></div><div class="field"><label>Name</label><input data-name="${esc(d.usb_path)}" value="${esc(d.model)}"></div></div><button class="btn small primary" data-add="${esc(d.usb_path)}">Add</button>`}</div>`).join("")}
    ${!v.receivers.length && !fresh.length ? `<div class="banner info">No receivers to add. Go back to discovery to turn on simulation mode, or skip and add receivers later from the station page.</div>` : ""}
    <p class="muted" style="font-size:13px">Antennas, filters, amplifiers and switches are drawn in the <a href="/rf" target="_blank">signal-path diagram</a>, at any time.</p>
    ${nav("receivers", {skip: true})}`; },
  satellites: () => { const s = W.sats; if (!s) return `<p class="muted">Loading…</p>`; const sd = doc("satellites");
    return `<h2>Satellites</h2>${msg()}
    <table><tr><th></th><th>Satellite</th><th>Downlink</th><th>What it sends</th></tr>${s.catalog.map((c) => `<tr><td><input type="checkbox" data-sat="${c.norad}" ${sd.selected?.includes(c.norad) ? "checked" : ""}></td><td><b>${esc(c.name)}</b> <span class="muted">NORAD ${c.norad}</span></td><td>${MHz(c.downlink_hz)}</td><td>${esc(c.mode || "")}</td></tr>`).join("")}</table>
    <div class="row2" style="margin-top:12px"><div class="field"><label>Ignore passes peaking below (°)</label><input id="minel" type="number" min="0" max="90" value="${esc(sd.min_elevation_deg)}"></div>
      <div class="field"><label>Orbital elements</label><label style="font-weight:400;font-size:14px;color:var(--ink)"><input type="checkbox" id="online" ${sd.refresh_online ? "checked" : ""}> Download current ones from CelesTrak</label></div></div>
    ${s.elements.map((e) => e.warning ? `<div class="banner warn">${esc(e.name || "NORAD " + e.norad)}: ${esc(e.warning)}</div>` : "").join("")}
    <p class="muted" style="font-size:13px">${s.elements.filter((e) => e.available).map((e) => `${esc(e.name)}: ${esc(e.source)}, epoch ${esc(local(e.epoch))}`).join("<br>")}</p>
    <button class="btn small" id="refresh" ${sd.refresh_online ? "" : "disabled"}>Refresh orbital elements now</button>
    <div id="passes" style="margin-top:12px"></div>
    ${nav("satellites", {next: "Save and continue", skip: true})}`; },
  scheduling: () => { const m = doc("scheduling").mode || "manual";
    const opt = (v, t, d) => `<label class="card" style="display:block;cursor:pointer"><input type="radio" name="mode" value="${v}" ${m === v ? "checked" : ""}> <b>${t}</b><div class="muted" style="font-size:13.5px;margin-left:22px">${d}</div></label>`;
    return `<h2>Scheduling</h2>${msg()}
    ${opt("manual", "Manual", "You book each recording: from the predicted passes, in the web page, or through the API.")}
    ${opt("automatic", "Automatic", "Passes of your satellites are booked on receivers you enable for automatic recording.")}
    ${opt("hybrid", "Hybrid", "Automatic bookings, and you can add or override recordings by hand.")}
    <div class="banner info">Whatever you choose, nothing records automatically yet: automatic recording needs a receiver that passed its hardware test and an enabled rule (Scheduler → Automatic rules), with Scheduling set to automatic or hybrid.</div>
    ${nav("scheduling", {next: "Save and continue", skip: true})}`; },
  integrations: () => `<h2>Integrations (optional)</h2>
    <p class="muted" style="font-size:13.5px;margin-top:0">Both are optional and can be set up or changed later in Settings. Starlab works fully without them.</p>
    <div class="card" id="int-calendar"></div>
    <div class="card" id="int-slack"></div>
    ${nav("integrations", {next: "Continue", skip: true})}`,
  validation: () => `<h2>Check the setup</h2><p class="muted" style="font-size:13.5px">Checks storage, the database, prediction, receivers and security settings. Warnings don't block finishing.</p>
    <button class="btn primary" id="validate">Run the checks</button><div id="checks" style="margin-top:12px">${W.checks ? checksTable(W.checks) : ""}</div>
    ${nav("validation", {next: "Continue"})}`,
  finish: () => `<h2>Finish</h2>${msg()}
    <p>Starlab is ready to use. From the station page you can draw your signal paths, test receivers, look at predicted passes and book recordings.</p>
    <div class="banner info">Automatic recording stays off. Simulated receivers and their recordings stay labelled as simulated.</div>
    <p style="font-size:14px"><b>Integrations:</b> ${W.integrations ? `Google Calendar ${W.integrations.calendar.enabled ? (W.integrations.calendar.running ? "on" : "on, not publishing yet") : "off"} · Slack ${W.integrations.slack.enabled ? (W.integrations.slack.running ? "on" : "on, not running") : "off"}` : "…"} <span class="muted" style="font-size:13px">(change them any time in Settings)</span></p>
    <div class="nav"><button class="btn" data-go="validation">Back</button><span class="sp"></span><button class="btn primary" id="finish">Finish setup</button></div>`,
};
function checksTable(c) {
  return `${c.ok ? "" : `<div class="banner err">Something must be fixed before setup can finish.</div>`}<table>${c.checks.map((x) => `<tr><td class="lv-${x.level}" style="font-weight:650;white-space:nowrap">${{pass: "✓ pass", warn: "! warning", fail: "✗ fail", info: "· info"}[x.level]}</td><td><b>${esc(x.check)}</b><div class="muted" style="font-size:13px">${esc(x.detail)}</div></td></tr>`).join("")}</table>`;
}
function nextId(v, skip = 0) {           // the (skip+1)-th free ID, so each card suggests a different one
  const taken = new Set(v.receivers.map((r) => r.id)); let n = 1, id;
  for (let k = 0; k <= skip; k++) { do { id = `RX-${String(n++).padStart(2, "0")}`; } while (taken.has(id)); }
  return id;
}

// ------------------------------------------------------------------ rendering and actions
function render() {
  const s = W.state;
  $("skip-all").hidden = !s.completed;
  $("steps").innerHTML = s.steps.map((x, i) => `<li class="${x.state}" data-go="${x.id}"><span class="n">${x.state === "done" ? "✓" : x.state === "skipped" ? "–" : i + 1}</span><span class="l">${esc(x.label)}${x.optional ? ` <span class="muted" style="font-weight:400">(optional)</span>` : ""}</span></li>`).join("");
  $("main").innerHTML = VIEW[s.step]();
  if (s.step === "satellites") showPasses();
  if (s.step === "integrations" && window.StarlabIntegrations) {
    StarlabIntegrations.mountCalendar($("int-calendar"), {api});
    StarlabIntegrations.mountSlack($("int-slack"), {api, withSettings: true});
  }
}
async function enter() {
  const st = W.state.step;
  if (["discovery", "receivers"].includes(st)) { W.inv = await api("/v1/inventory"); }
  if (st === "satellites") W.sats = await api("/v1/satellites");
  if (st === "finish") W.integrations = await api("/v1/integrations").catch(() => null);
  render();
}
async function showPasses() {
  const box = $("passes"); if (!box) return;
  try {
    const p = await api("/v1/passes/predicted?hours=24");
    box.innerHTML = p.location_set ? `<b style="font-size:14px">Next 24 hours</b><table>${p.passes.slice(0, 8).map((x) => `<tr><td>${esc(local(x.aos))}</td><td>${esc(x.name)}</td><td>peak ${x.max_elevation_deg}°</td><td>${Math.round(x.duration_s / 60)} min</td></tr>`).join("") || "<tr><td>No passes above the minimum elevation.</td></tr>"}</table>`
      : `<div class="banner warn">${esc(p.warning)}</div>`;
  } catch (e) { box.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
}
async function pollTest(rid, testId) {
  const el = () => document.querySelector(`[data-vstat="${rid}"]`);
  for (;;) {
    const d = await api(`/v1/rf/tests/${testId}`);
    if (el()) el().textContent = d.progress.label;
    if (d.progress.done) break;
    await new Promise((r) => setTimeout(r, 1500));
  }
  W.inv = await api("/v1/inventory"); render();
}
document.addEventListener("click", async (e) => {
  const t = e.target;
  try {
    const go = t.closest("[data-go]"); if (go) { await step(go.dataset.go, "goto"); return enter(); }
    const sk = t.closest("[data-skip]"); if (sk) { await step(sk.dataset.skip, "skip"); return enter(); }
    if (t.id === "geo") {
      if (!navigator.geolocation) { W.msg = ["warn", "This browser can't share its location here (it needs HTTPS or localhost). Type the coordinates instead."]; return render(); }
      navigator.geolocation.getCurrentPosition((p) => { $("o-lat").value = p.coords.latitude.toFixed(5); $("o-lon").value = p.coords.longitude.toFixed(5); if (p.coords.altitude != null) $("o-elev").value = Math.round(p.coords.altitude); },
        () => { W.msg = ["warn", "The browser did not share its location. Type the coordinates instead."]; render(); });
      return;
    }
    if (t.id === "discover") { t.disabled = true; W.inv = await api("/v1/inventory"); return render(); }
    if (t.dataset.identify) { t.disabled = true; t.textContent = "Identifying…"; const r = await api("/v1/inventory/identify", {method: "POST", body: JSON.stringify({usb_path: t.dataset.identify})}); W.msg = r.ok ? ["ok", "Identified"] : ["err", r.error || (r.problems || []).join("; ")]; W.inv = await api("/v1/inventory"); return render(); }
    if (t.dataset.add) { t.disabled = true; const p = t.dataset.add;
      const r = await api("/v1/inventory/receivers", {method: "POST", body: JSON.stringify({usb_path: p, id: document.querySelector(`[data-id="${p}"]`).value.trim(), name: document.querySelector(`[data-name="${p}"]`).value.trim()})});
      W.msg = ["ok", `${r.id} added. Verify it next.`]; W.inv = await api("/v1/inventory"); return render(); }
    if (t.dataset.verify) { t.disabled = true; const rid = t.dataset.verify;
      const r = await api(`/v1/inventory/receivers/${encodeURIComponent(rid)}/verify`, {method: "POST", body: "{}"});
      document.querySelector(`[data-vstat="${rid}"]`).textContent = "Booked; starting in about 25 s…"; return pollTest(rid, r.test_id); }
    if (t.id === "refresh") { t.disabled = true; const r = await api("/v1/satellites/refresh", {method: "POST", body: "{}"}); W.msg = [Object.keys(r.failed).length ? "warn" : "ok", `Updated ${r.updated.length} satellite(s)${Object.keys(r.failed).length ? `; failed: ${Object.entries(r.failed).map(([k, v]) => k + " (" + v + ")").join(", ")}` : ""}`]; W.sats = await api("/v1/satellites"); return render(); }
    if (t.id === "validate") { t.disabled = true; W.checks = await api("/v1/setup/validate", {method: "POST", body: "{}"}); return render(); }
    if (t.id === "finish") { t.disabled = true; await api("/v1/setup/finish", {method: "POST", body: "{}"}); location.href = "/rf"; return; }
    const nx = t.closest("[data-next]");
    if (nx) {
      const id = nx.dataset.next; nx.disabled = true;
      if (id === "identity") {
        const num = (v) => v === "" ? null : Number(v);
        await saveDoc("observatory", {name: $("o-name").value.trim(), description: $("o-desc").value.trim(), timezone: $("o-tz").value.trim(),
          latitude: num($("o-lat").value), longitude: num($("o-lon").value), elevation_m: num($("o-elev").value)});
      }
      if (id === "satellites") await saveDoc("satellites", {selected: [...document.querySelectorAll("[data-sat]")].filter((c) => c.checked).map((c) => Number(c.dataset.sat)), min_elevation_deg: Number($("minel").value), refresh_online: $("online").checked});
      if (id === "scheduling") await saveDoc("scheduling", {mode: document.querySelector("[name=mode]:checked").value});
      await step(id, "done"); return enter();
    }
  } catch (err) { W.msg = ["err", err.message]; render(); }
});
document.addEventListener("change", async (e) => {
  try {
    if (e.target.id === "sim") { await saveDoc("simulation", {enabled: e.target.checked}); W.inv = await api("/v1/inventory"); W.msg = ["ok", e.target.checked ? "Simulation mode on: simulated receivers are offered." : "Simulation mode off."]; render(); }
    if (e.target.id === "online") { $("refresh").disabled = true; }
  } catch (err) { W.msg = ["err", err.message]; render(); }
});
(async () => {
  try { W.state = await api("/v1/setup"); await loadCfg(); await enter(); } catch (e) { if (e.message !== "not signed in") $("main").innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
