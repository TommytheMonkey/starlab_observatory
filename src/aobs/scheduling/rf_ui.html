<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Paths</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --ink: #16191d; --ink-2: #5b6470; --line: #dde1e6;
  --accent: #2f6fdb; --accent-ink: #ffffff; --ok: #1f9d55; --warn: #c98a00; --bad: #d64545; --unk: #8a94a0;
  --ok-bg: #e5f6ec; --warn-bg: #fdf3dc; --bad-bg: #fbe7e7; --unk-bg: #eef0f3;
  --k-antenna: #2f6fdb; --k-filter: #8b5cf6; --k-amplifier: #e0661b; --k-switch: #0e9488; --k-other: #6b7280;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --ink: #e8ebef; --ink-2: #9aa4b0; --line: #2d333d;
    --accent: #5b8ff0; --ok: #3fbf74; --warn: #e3a72a; --bad: #f06a6a; --unk: #7d8794;
    --ok-bg: #16301f; --warn-bg: #33290f; --bad-bg: #3a1a1a; --unk-bg: #242a33;
    --k-antenna: #5b8ff0; --k-filter: #a68af8; --k-amplifier: #f0884a; --k-switch: #2bb5a7; --k-other: #9aa3ad;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --ink: #e8ebef; --ink-2: #9aa4b0; --line: #2d333d;
  --accent: #5b8ff0; --ok: #3fbf74; --warn: #e3a72a; --bad: #f06a6a; --unk: #7d8794;
  --ok-bg: #16301f; --warn-bg: #33290f; --bad-bg: #3a1a1a; --unk-bg: #242a33;
  --k-antenna: #5b8ff0; --k-filter: #a68af8; --k-amplifier: #f0884a; --k-switch: #2bb5a7; --k-other: #9aa3ad;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; }
.top h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.ver { color: var(--ink-2); font-size: 12.5px; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.banner { margin: 10px 16px 0; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
.banner.err { background: var(--bad-bg); color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner ul { margin: 4px 0 0 18px; padding: 0; }
.layout { display: grid; grid-template-columns: 270px 1fr; gap: 16px; padding: 16px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.bin { position: sticky; top: 70px; padding: 12px; max-height: calc(100vh - 90px); overflow: auto; }
@media (max-width: 820px) { .bin { position: static; max-height: none; } }
.bin h2, .lanes h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 0 0 8px; font-weight: 650; }
.bin .group { margin: 10px 0 4px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.bin .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 8px; }
.bin.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
.binhint { font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.chip { touch-action: none; user-select: none; -webkit-user-select: none; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-left: 4px solid var(--kc, var(--k-other)); background: var(--panel);
  border-radius: 8px; padding: 6px 9px 6px 7px; box-shadow: var(--shadow); cursor: grab; max-width: 220px; text-align: left; }
.chip:hover { border-color: var(--kc); }
.chip.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip .txt { min-width: 0; flex: 1; display: block; }
.chip .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; font-size: 13px; }
.chip .sub { display: block; font-size: 11px; color: var(--ink-2); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip svg { flex: none; color: var(--kc); }
.chip.broken { background: var(--bad-bg); }
.chip.suspect { background: var(--warn-bg); }
.k-antenna { --kc: var(--k-antenna); } .k-filter { --kc: var(--k-filter); } .k-amplifier { --kc: var(--k-amplifier); }
.k-switch { --kc: var(--k-switch); } .k-splitter, .k-attenuator, .k-cable, .k-other { --kc: var(--k-other); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--unk); }
.dot.working, .dot.ok { background: var(--ok); } .dot.suspect, .dot.warn { background: var(--warn); }
.dot.broken, .dot.fault { background: var(--bad); }
.lanes { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lane { padding: 0; overflow: hidden; }
.lane-h { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.lane-h .dot { width: 12px; height: 12px; margin-top: 4px; }
.lane-h .title { font-weight: 650; font-size: 15px; }
.lane-h .meta { font-size: 12.5px; color: var(--ink-2); }
.lane-h .facts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; margin-top: 3px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--unk-bg); color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.fault { background: var(--bad-bg); color: var(--bad); }
.flow { display: flex; align-items: center; gap: 0; padding: 14px; overflow-x: auto; min-height: 76px; }
.flow.over { background: var(--panel-2); }
.slot { flex: none; width: 22px; align-self: stretch; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: width .12s; }
.slot::before { content: ""; width: 14px; height: 2px; background: var(--line); }
body.dragging .slot { width: 40px; }
body.dragging .slot::before { width: 4px; height: 36px; border-radius: 2px; background: var(--line); }
.slot.over { background: var(--panel-2); }
.slot.over::before { background: var(--accent) !important; }
.rxblock { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px;
  background: var(--panel-2); border: 1px solid var(--line); font-weight: 650; white-space: nowrap; }
.empty-flow { color: var(--ink-2); font-size: 13px; padding: 0 6px; white-space: nowrap; }
.pathtext { font-size: 12px; color: var(--ink-2); padding: 0 14px 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word; }
.lanewarn { font-size: 12.5px; color: var(--warn); padding: 0 14px 10px; }
.switchbox { flex: none; border: 1px solid var(--line); border-left: 4px solid var(--k-switch); border-radius: 10px; background: var(--panel); padding: 8px; box-shadow: var(--shadow); }
.switchbox .sw-h { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; cursor: grab; touch-action: none; font-weight: 600; font-size: 13px; color: var(--k-switch); }
.port { display: flex; align-items: center; gap: 8px; padding: 3px; border-radius: 7px; min-height: 38px; }
.port .pn { width: 22px; text-align: right; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.port .pe { font-size: 12px; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 7px; padding: 6px 10px; min-width: 140px; }
.port.over { background: var(--panel-2); outline: 2px dashed var(--accent); }
.port.active .pn { color: var(--k-switch); font-weight: 700; }
.board { font-size: 12px; margin-top: 8px; padding: 6px 8px; border-radius: 7px; max-width: 260px; }
.board.ok { background: var(--ok-bg); color: var(--ok); }
.board.warn { background: var(--warn-bg); color: var(--warn); }
.board .btn { margin-top: 6px; }
.ghost { position: fixed; z-index: 100; pointer-events: none; opacity: .9; transform: rotate(-2deg); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.drawer { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.15); transform: translateX(105%); transition: transform .18s;
  display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.drawer-h h3 { margin: 0; font-size: 16px; flex: 1; }
.drawer-b { padding: 14px 16px 24px; overflow: auto; flex: 1; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 7px 9px; }
.field textarea { min-height: 70px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--panel); padding: 6px 4px; font-size: 12.5px; border-right: 1px solid var(--line); display: flex; gap: 5px; align-items: center; justify-content: center; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--panel-2); font-weight: 650; }
.evidence { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 12px; }
.hist { border-bottom: 1px solid var(--line); padding: 10px 0; }
.hist .hh { display: flex; gap: 8px; align-items: baseline; }
.hist .hh b { font-size: 13.5px; }
.hist ul { margin: 4px 0 6px 18px; padding: 0; font-size: 12.5px; color: var(--ink-2); }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 40; display: none; }
.scrim.open { display: block; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 200; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }
.signin { max-width: 520px; margin: 60px auto; padding: 24px; }
.muted { color: var(--ink-2); }
.savebox { display: flex; gap: 6px; align-items: center; }
.savebox input { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 6px 9px; width: 220px; }
@media (max-width: 600px) { .savebox input { width: 140px; } .top h1 { font-size: 15px; }
  .flow { flex-wrap: wrap; row-gap: 8px; overflow-x: visible; padding: 12px 10px; } .layout { padding: 12px; } }
.testbtn { margin-left: 10px; vertical-align: 1px; }
.testmenu { position: fixed; z-index: 70; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 4px; width: 300px; }
.testmenu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; }
.testmenu button:hover, .testmenu button:focus { background: var(--panel-2); }
.testmenu span { display: block; font-size: 12px; color: var(--ink-2); }
.lab { position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(1080px, 100vw); background: var(--bg);
  border-left: 1px solid var(--line); box-shadow: -10px 0 40px rgba(0,0,0,.2); display: none; flex-direction: column; }
.lab.open { display: flex; }
.lab-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.lab-h h3 { margin: 0; font-size: 16px; flex: 1; }
.lab-b { overflow: auto; padding: 16px; flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.vpath { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 13.5px; }
.vpath .st { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid var(--line); border-left: 4px solid var(--kc, var(--k-other)); border-radius: 8px; background: var(--panel); }
.vpath .ar { color: var(--ink-2); padding-left: 18px; line-height: 1; }
.vpath .rxst { border-left-color: var(--ink-2); font-weight: 650; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.chips-sel { display: flex; flex-wrap: wrap; gap: 6px; }
.chips-sel button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 11px; font-size: 12.5px; }
.chips-sel button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.prog { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
.prog > div { height: 100%; background: var(--accent); transition: width .4s; }
.steps { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.steps .on { color: var(--ink); font-weight: 650; } .steps .done { color: var(--ok); }
.big { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.metric { background: var(--panel-2); border-radius: 8px; padding: 9px 11px; }
.metric .lbl { font-size: 11.5px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.metric .val { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.metric .sub { font-size: 11.5px; color: var(--ink-2); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.tabs button { border: 0; background: none; padding: 7px 11px; border-bottom: 2px solid transparent; color: var(--ink-2); font-weight: 600; font-size: 13px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.plot { position: relative; width: 100%; }
.plot canvas { width: 100%; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: crosshair; touch-action: pan-y; }
.plot .readout { position: absolute; top: 6px; right: 10px; font-size: 11.5px; background: var(--panel); padding: 2px 6px; border-radius: 6px; color: var(--ink-2); pointer-events: none; font-variant-numeric: tabular-nums; }
.plotbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); margin: 6px 0; }
.plotbar input[type=range] { width: 120px; }
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.t th, table.t td { text-align: left; padding: 5px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--ink-2); font-weight: 600; }
table.t td.num { font-variant-numeric: tabular-nums; text-align: right; }
table.t tr.clk { cursor: pointer; } table.t tr.clk:hover td { background: var(--panel-2); }
.good { color: var(--ok); } .bad { color: var(--bad); }
.facts li { margin: 2px 0; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
</style>
</head>
<body>
<div class="top">
  <h1>Signal Paths</h1>
  <span class="ver" id="ver"></span>
  <span class="pill" id="dirty" hidden>Unsaved changes</span>
  <span class="spacer"></span>
  <button class="btn" id="b-tests">Testing</button>
  <button class="btn" id="b-hist">History</button>
  <button class="btn" id="b-discard" hidden>Discard</button>
  <span class="savebox"><input id="note" placeholder="What changed? (optional)" maxlength="500"><button class="btn primary" id="b-save" disabled>Save</button></span>
</div>
<div id="banners"></div>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-h"><h3 id="d-title"></h3><button class="btn small" id="d-close">Close</button></div><div class="drawer-b" id="d-body"></div></aside>
<div class="toast" id="toast"></div>
<section class="lab" id="lab" aria-hidden="true"><div class="lab-h"><h3 id="lab-title"></h3><span id="lab-actions"></span><button class="btn small" id="lab-close">Close</button></div><div class="lab-b" id="lab-body"></div></section>
<script>
"use strict";
const ICON = {
  antenna: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 15V6M8 6L3 1M8 6l5-5M5 3.5l3 2.5 3-2.5"/></svg>',
  filter: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 8c1.5-4 3-4 4.5 0S8.5 12 10 8s3-4 5 0"/><path d="M3 13h10" opacity=".5"/></svg>',
  amplifier: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 2v12l11-6z"/></svg>',
  switch: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="3" cy="8" r="1.5"/><circle cx="13" cy="3" r="1.5"/><circle cx="13" cy="13" r="1.5"/><path d="M4.4 7.3L11.6 3.7"/></svg>',
  splitter: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 8h6l7-5M7 8l7 5"/></svg>',
  attenuator: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 8h2l1.5-4 2 8 2-8 2 8 1.5-4h3"/></svg>',
  cable: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 12c4 0 4-8 7-8s3 8 7 8"/></svg>',
  other: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>',
  receiver: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="4.5" width="13" height="8" rx="1.5"/><path d="M4 8.5h4M11 8.5h.01" stroke-linecap="round"/></svg>'
};
const KIND_LABEL = {antenna: "Antennas", filter: "Filters", amplifier: "Amplifiers", switch: "Switches", splitter: "Splitters",
  attenuator: "Attenuators", cable: "Cables", other: "Other"};
const STATUS_LABEL = {working: "Working", suspect: "Suspect", broken: "Broken", unknown: "Unknown"};
const POWER_LABEL = {none: "No power", external: "Own supply", bias_tee: "Bias tee"};
const S = {data: null, layout: null, base: null, saved: "", sel: null, check: {errors: [], warnings: []}, conflict: null, signin: false};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const dirty = () => S.layout && JSON.stringify(S.layout) !== S.saved;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString(undefined, {weekday: "short", hour: "2-digit", minute: "2-digit", month: "short", day: "numeric"});
}

async function api(path, opts = {}) {
  const r = await fetch(path, {credentials: "same-origin", ...opts,
    headers: {"Content-Type": "application/json", "X-AOBS-RF": "1", ...(opts.headers || {})}});
  if (r.status === 401) { S.signin = true; render(); throw new Error("not signed in"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || j.detail || r.statusText);
  return j;
}

// ------------------------------------------------------------------ loading
async function load(replace) {
  const d = await api("/v1/rf");
  S.signin = false;
  const changedOnServer = S.data && d.version !== S.base;
  S.data = d;
  if (replace || !S.layout || (!dirty() && changedOnServer)) {
    S.layout = clone(d.layout); S.base = d.version; S.saved = JSON.stringify(d.layout); S.conflict = null;
    S.check = {errors: [], warnings: []};
  } else if (changedOnServer && dirty()) {
    S.conflict = d.version;
  }
  render();
}

let checkTimer = null;
function changed() {
  render();
  clearTimeout(checkTimer);
  if (!dirty()) { S.check = {errors: [], warnings: []}; render(); return; }
  checkTimer = setTimeout(async () => {
    try {
      const r = await api("/v1/rf", {method: "POST", body: JSON.stringify({layout: S.layout, base_version: S.base, dry_run: true})});
      S.check = {errors: r.errors || [], warnings: r.warnings || []};
      if (r.derived) S.data.derived = r.derived;
    } catch (e) { S.check = {errors: [String(e.message || e)], warnings: []}; }
    render();
  }, 250);
}

// ------------------------------------------------------------------ model helpers
const comps = () => S.layout.components;
const rxs = () => S.layout.receivers;
const SW = () => S.data.switch_id;
function where(cid) {
  for (const [rid, r] of Object.entries(rxs())) { const i = r.chain.indexOf(cid); if (i >= 0) return {type: "lane", rx: rid, index: i}; }
  for (const c of Object.values(comps())) if (c.kind === "switch") for (const [p, a] of Object.entries(c.ports || {})) if (a === cid) return {type: "port", sw: c.id, port: p};
  return {type: "bin"};
}
function detach(cid) {
  const w = where(cid);
  if (w.type === "lane") rxs()[w.rx].chain.splice(w.index, 1);
  if (w.type === "port") comps()[w.sw].ports[w.port] = null;
}
const isHead = (cid) => cid && ["antenna", "switch"].includes(comps()[cid]?.kind);
function placeLane(cid, rid, index) {
  const c = comps()[cid];
  if (c.kind === "switch" && rid !== S.data.switch_receiver) { toast(`${c.name} is wired to ${S.data.switch_receiver} only`); return false; }
  const before = where(cid);
  detach(cid);
  const chain = rxs()[rid].chain;
  if (before.type === "lane" && before.rx === rid && before.index < index) index -= 1;
  if (c.kind === "antenna" || c.kind === "switch") {
    if (isHead(chain[0])) {
      const out = chain.shift();
      if (comps()[out].kind === "switch" && rid === S.data.switch_receiver && c.kind === "antenna") {
        chain.unshift(out); toast(`${rid} is driven through ${out}; drop antennas on its ports`); attachBack(cid, before); return false;
      }
      toast(`${comps()[out].name} moved to the parts bin`);
    }
    chain.unshift(cid);
  } else {
    if (isHead(chain[0])) index = Math.max(index, 1);
    chain.splice(Math.min(index, chain.length), 0, cid);
  }
  return true;
}
function attachBack(cid, w) {
  if (w.type === "lane") rxs()[w.rx].chain.splice(w.index, 0, cid);
  if (w.type === "port") comps()[w.sw].ports[w.port] = cid;
}
function placePort(cid, sw, port) {
  const c = comps()[cid];
  if (c.kind !== "antenna") { toast("Only antennas go on switch ports"); return false; }
  detach(cid);
  const occ = comps()[sw].ports[port];
  if (occ && occ !== cid) toast(`${comps()[occ].name} moved to the parts bin`);
  comps()[sw].ports[port] = cid;
  return true;
}
function toBin(cid) {
  const c = comps()[cid];
  if (c.kind === "switch" && where(cid).type === "lane" && where(cid).rx === S.data.switch_receiver) { toast(`${S.data.switch_receiver} needs ${c.name}; it can't be removed here`); return false; }
  detach(cid); return true;
}

// ------------------------------------------------------------------ health
function rxHealth(rid) {
  const r = rxs()[rid];
  const chainBad = r.chain.map((c) => comps()[c]).filter((c) => c && (c.status === "broken" || c.status === "suspect"));
  const reasons = [];
  let level = "ok";
  const bump = (l) => { const o = {ok: 0, unknown: 1, warn: 2, fault: 3}; if (o[l] > o[level]) level = l; };
  if (!r.managed) {
    const st = r.status || "unknown";
    reasons.push({text: `Not run by the broker${r.host ? " · " + r.host : ""}`, cls: ""});
    bump({working: "ok", suspect: "warn", broken: "fault", unknown: "unknown"}[st]);
  } else {
    const st = (S.data.status || {})[rid] || {};
    if (st.connected === false) { bump("fault"); reasons.push({text: "Not on USB", cls: "fault"}); }
    else if (st.connected) reasons.push({text: "USB connected", cls: "ok"});
    if (st.state) reasons.push({text: st.state, cls: /RECORDING/.test(st.state) ? "ok" : ""});
    const iq = st.iq_health;
    if (iq) {
      const cls = ["suspicious_flat", "capture_failure"].includes(iq.status) ? "fault" : iq.status === "healthy" ? "ok" : "warn";
      bump(cls === "ok" ? "ok" : cls);
      reasons.push({text: `IQ: ${iq.label}${iq.rms_dbfs != null ? " (" + iq.rms_dbfs.toFixed(1) + " dBFS)" : ""} · ${when(iq.at)}`, cls});
    } else if (S.data.receiver_info[rid]?.driver === "rtlsdr") reasons.push({text: "IQ: not assessed yet", cls: ""});
    if (st.last_error) { bump("warn"); reasons.push({text: `Last failure: ${st.last_error.target || st.last_error.job_name} ${when(st.last_error.record_start)}`, cls: "warn"}); }
  }
  for (const c of chainBad) { bump(c.status === "broken" ? "fault" : "warn"); reasons.push({text: `${c.name}: ${STATUS_LABEL[c.status]}`, cls: c.status === "broken" ? "fault" : "warn"}); }
  if (!isHead(r.chain[0])) { bump("warn"); reasons.push({text: "No antenna connected", cls: "warn"}); }
  return {level, reasons};
}

// ------------------------------------------------------------------ rendering
function chip(cid, extra = "") {
  const c = comps()[cid];
  if (!c) return "";
  const sub = [c.model, c.kind === "amplifier" && c.gain_db != null ? `+${c.gain_db} dB` : "", c.power !== "none" ? POWER_LABEL[c.power] : ""].filter(Boolean).join(" · ");
  return `<button class="chip k-${c.kind} ${c.status} ${S.sel?.type === "part" && S.sel.id === cid ? "sel" : ""}" data-chip="${esc(cid)}" ${extra} title="${esc(c.name)} — ${STATUS_LABEL[c.status]}">
    ${ICON[c.kind] || ICON.other}<span class="txt"><span class="nm">${esc(c.name)}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span><span class="dot ${c.status}"></span></button>`;
}
function switchBox(cid, rid) {
  const c = comps()[cid];
  const st = (S.data.status || {})[rid] || {};
  const ports = Object.keys(c.ports).sort((a, b) => a - b).map((p) => {
    const a = c.ports[p];
    return `<div class="port" data-drop="port" data-sw="${esc(cid)}" data-port="${p}"><span class="pn">${p}</span>${a ? chip(a) : `<span class="pe">empty port</span>`}</div>`;
  }).join("");
  return `<div class="switchbox" data-chip="${esc(cid)}"><div class="sw-h" data-chip-handle="${esc(cid)}">${ICON.switch}<span>${esc(c.name)}</span><span class="dot ${c.status}"></span></div>${ports}${boardLine()}</div>`;
}
function boardLine() {
  const b = S.data.switch_board || {};
  if (!b.available) return "";
  if (!b.reachable) return `<div class="board warn">Switch board unreachable: ${esc(b.error || "")}</div>`;
  if (b.in_sync) return `<div class="board ok">✓ The switch board (antswitch.local) has these names</div>`;
  const d = (b.differences || []).map((x) => `port ${x.port}: board says ${x.board || "empty"}`).join("; ");
  return `<div class="board warn">The switch board differs: ${esc(d)}.
    ${dirty() ? "<br>Save first, then send." : `<br><button class="btn small" data-push-switch>Send these names to the switch</button>`}</div>`;
}
function lane(rid) {
  const r = rxs()[rid];
  const info = (S.data.receiver_info || {})[rid] || {};
  const h = rxHealth(rid);
  const label = r.managed ? rid : (r.label || rid);
  const meta = r.managed ? [info.hardware, `serial ${info.serial}`, info.mode && `${info.mode} mode`].filter(Boolean).join(" · ")
    : [r.hardware, r.serial && `serial ${r.serial}`].filter(Boolean).join(" · ");
  let flow = "";
  r.chain.forEach((cid, i) => {
    flow += `<div class="slot" data-drop="slot" data-rx="${esc(rid)}" data-index="${i}"></div>`;
    flow += comps()[cid]?.kind === "switch" ? switchBox(cid, rid) : chip(cid);
  });
  flow += `<div class="slot" data-drop="slot" data-rx="${esc(rid)}" data-index="${r.chain.length}"></div>`;
  if (!r.chain.length) flow += `<span class="empty-flow">Drag an antenna here</span><div class="slot" data-drop="slot" data-rx="${esc(rid)}" data-index="0"></div>`;
  flow += `<div class="rxblock">${ICON.receiver}${esc(label)}</div>`;
  const derived = (S.data.derived || {})[rid];
  const laneWarn = S.check.warnings.filter((w) => w.startsWith(rid + " ") || w.startsWith(rid + ":") || w.startsWith(rid + "'s"));
  return `<section class="panel lane" data-rx-lane="${esc(rid)}">
    <div class="lane-h" data-open-rx="${esc(rid)}"><span class="dot ${h.level}"></span><div style="min-width:0;flex:1">
      <div class="title">${esc(label)}${r.managed ? "" : ` <span class="tag">external</span>`}${r.managed ? `<button class="btn small testbtn" data-test-menu="${esc(rid)}" aria-haspopup="menu">Test ▾</button>` : ""}</div>
      <div class="meta">${esc(meta)}</div>
      <div class="facts">${h.reasons.map((x) => `<span class="tag ${x.cls}">${esc(x.text)}</span>`).join("")}</div>
      ${r.notes ? `<div class="meta" style="margin-top:3px">${esc(r.notes)}</div>` : ""}
    </div></div>
    <div class="flow" data-drop="lane" data-rx="${esc(rid)}">${flow}</div>
    ${derived ? `<div class="pathtext">Recorded as: ${esc(derived.signal_path)}</div>` : ""}
    ${laneWarn.map((w) => `<div class="lanewarn">⚠ ${esc(w)}</div>`).join("")}
  </section>`;
}
function bin() {
  const loose = Object.values(comps()).filter((c) => where(c.id).type === "bin");
  const groups = {};
  for (const c of loose) (groups[c.kind] ||= []).push(c);
  const order = ["antenna", "filter", "amplifier", "switch", "splitter", "attenuator", "cable", "other"];
  const body = order.filter((k) => groups[k]).map((k) => `<div class="group">${KIND_LABEL[k]}</div><div class="chips">${groups[k].sort((a, b) => a.name.localeCompare(b.name)).map((c) => chip(c.id)).join("")}</div>`).join("");
  return `<aside class="panel bin" data-drop="bin"><h2>Parts bin</h2>
    ${body || `<div class="muted" style="font-size:13px">Everything is connected. Drag a part here to disconnect it.</div>`}
    <div class="addrow" style="margin-top:14px"><button class="btn small" data-new-part>+ New part</button><button class="btn small" data-new-rx>+ Other receiver</button></div>
    <div class="binhint">Drag parts onto a receiver's path, between parts, or onto a switch port. Click a part to set whether it's working.</div></aside>`;
}
function render() {
  if (S.signin) {
    $("app").innerHTML = `<div class="panel signin"><h2 style="margin-top:0">Sign in</h2><p>This page needs a sign-in link from the observatory bot.</p>
      <p>In <b>#star-lab</b>, ask <b>@observatory</b>: <i>"give me the RF editor link"</i>. The link works for 15 minutes; after that this browser stays signed in for 30 days.</p></div>`;
    return;
  }
  if (!S.data) { $("app").innerHTML = `<p class="muted" style="padding:16px">Loading…</p>`; return; }
  const managed = Object.keys(rxs()).filter((r) => rxs()[r].managed).sort();
  const ext = Object.keys(rxs()).filter((r) => !rxs()[r].managed).sort();
  $("app").innerHTML = `<div class="layout">${bin()}<main class="lanes">${[...managed, ...ext].map(lane).join("")}</main></div>`;
  $("ver").textContent = `v${S.base} · saved ${when(S.data.saved_at)} by ${S.data.author}`;
  $("dirty").hidden = !dirty();
  $("b-discard").hidden = !dirty();
  $("b-save").disabled = !dirty() || S.check.errors.length > 0;
  const b = [];
  if (typeof Lab !== "undefined") { const ob = Lab.offerBanner(); if (ob) b.push(ob); }
  if (S.conflict) b.push(`<div class="banner err">Version ${S.conflict} was saved somewhere else while you were editing. <button class="btn small" data-reload>Reload it</button> (discards your unsaved changes)</div>`);
  if (S.check.errors.length) b.push(`<div class="banner err"><b>Can't save yet:</b><ul>${S.check.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>`);
  const general = S.check.warnings.filter((w) => !Object.keys(rxs()).some((r) => w.startsWith(r + " ") || w.startsWith(r + ":") || w.startsWith(r + "'s")));
  if (general.length) b.push(`<div class="banner warn"><ul>${general.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>`);
  $("banners").innerHTML = b.join("");
  if (S.sel) renderDrawer();
}

// ------------------------------------------------------------------ drawer
function openDrawer(sel) { S.sel = sel; $("drawer").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false"); $("scrim").classList.add("open"); render(); renderDrawer(); }
function closeDrawer() { S.sel = null; $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); $("scrim").classList.remove("open"); render(); }
function seg(name, options, value, labels) {
  return `<div class="seg" data-seg="${name}">${options.map((o) => `<button type="button" data-val="${o}" class="${o === value ? "on" : ""}">${name === "status" ? `<span class="dot ${o}"></span>` : ""}${esc(labels[o] || o)}</button>`).join("")}</div>`;
}
function destinations(cid) {
  const c = comps()[cid];
  const opts = [`<option value="bin">Parts bin (not connected)</option>`];
  for (const rid of Object.keys(rxs()).sort()) {
    if (c.kind === "switch" && rid !== S.data.switch_receiver) continue;
    opts.push(`<option value="rx:${esc(rid)}">${esc(rxs()[rid].managed ? rid : rxs()[rid].label || rid)}${["antenna", "switch"].includes(c.kind) ? " (as its antenna)" : " (end of path)"}</option>`);
  }
  if (c.kind === "antenna") for (const sw of Object.values(comps()).filter((x) => x.kind === "switch"))
    for (const p of Object.keys(sw.ports)) opts.push(`<option value="port:${esc(sw.id)}:${p}">${esc(sw.name)} port ${p}${sw.ports[p] ? " (replaces " + esc(comps()[sw.ports[p]]?.name) + ")" : ""}</option>`);
  return opts.join("");
}
function renderDrawer() {
  const s = S.sel;
  if (!s) return;
  if (s.type === "history") return renderHistory();
  if (s.type === "part") {
    const c = comps()[s.id];
    if (!c) { closeDrawer(); return; }
    const w = where(c.id);
    const loc = w.type === "bin" ? "In the parts bin" : w.type === "lane" ? `In ${w.rx}'s path` : `On ${comps()[w.sw].name} port ${w.port}`;
    const u = (S.data.usage || {})[c.id];
    const ev = u ? `Last recording through this part: <b>${esc(u.target || u.recording_id)}</b> on ${esc(u.receiver)}, ${esc(when(u.at))} — ${esc(u.status)}${u.iq_label ? ", IQ " + esc(u.iq_label) : ""} <span class="muted">(${esc(u.recording_id)})</span>`
      : "No recording in the last 14 days has gone through this part.";
    $("d-title").textContent = c.name;
    setTimeout(() => (S.partTab === "perf" ? Lab.partPerformanceCompact(c.id) : Lab.partTests(c.id)), 0);
    $("d-body").innerHTML = `
      <div class="evidence">${esc(loc)}<br>${ev}</div>
      <div class="tabs"><button class="${S.partTab !== "perf" ? "on" : ""}" data-ptab="details">Details</button><button class="${S.partTab === "perf" ? "on" : ""}" data-ptab="perf">Performance</button></div>
      ${S.partTab === "perf" ? `<div id="part-perf" data-part="${esc(c.id)}"><p class="muted">Loading performance history…</p></div>` : `<div class="evidence" id="part-tests" data-part="${esc(c.id)}">Looking for signal-path tests with this part…</div>`}
      <div ${S.partTab === "perf" ? "hidden" : ""}>
      <div class="field"><label>Is it working?</label>${seg("status", S.data.statuses, c.status, STATUS_LABEL)}</div>
      <div class="field"><label>Name</label><input data-f="name" value="${esc(c.name)}" maxlength="80"></div>
      <div class="row2"><div class="field"><label>Kind</label><select data-f="kind">${S.data.kinds.map((k) => `<option value="${k}" ${k === c.kind ? "selected" : ""} ${(k === "switch") !== (c.kind === "switch") ? "disabled" : ""}>${k}</option>`).join("")}</select></div>
      <div class="field"><label>Model</label><input data-f="model" value="${esc(c.model)}" maxlength="120"></div></div>
      <div class="field"><label>Power</label>${seg("power", S.data.powers, c.power, POWER_LABEL)}</div>
      <div class="row2"><div class="field"><label>From (MHz)</label><input data-f="min_mhz" inputmode="decimal" value="${c.min_mhz ?? ""}"></div>
      <div class="field"><label>To (MHz)</label><input data-f="max_mhz" inputmode="decimal" value="${c.max_mhz ?? ""}"></div></div>
      ${c.kind === "amplifier" || c.kind === "attenuator" ? `<div class="field"><label>Gain (dB, negative for loss)</label><input data-f="gain_db" inputmode="decimal" value="${c.gain_db ?? ""}"></div>` : ""}
      <div class="field"><label>Notes</label><textarea data-f="notes" maxlength="2000">${esc(c.notes)}</textarea></div>
      <div class="field"><label>Move to</label><select data-move>${`<option value="">— choose —</option>` + destinations(c.id)}</select></div>
      <div class="field"><label>ID</label><input data-newid value="${esc(c.id)}" maxlength="48" ${JSON.parse(S.saved).components[c.id] ? "disabled" : ""}><div class="muted" style="font-size:12px;margin-top:3px">Recording jobs name antennas by this ID${c.kind === "antenna" ? "; on the antenna switch it can be at most 16 characters" : ""}. It can be changed only before the part is first saved.</div></div>
      ${w.type === "bin" ? `<button class="btn danger" data-del-part>Delete this part</button>` : `<span class="muted" style="font-size:12px">Move it to the parts bin to delete it.</span>`}</div>`;
    return;
  }
  if (s.type === "rx") {
    const r = rxs()[s.id];
    if (!r) { closeDrawer(); return; }
    const info = (S.data.receiver_info || {})[s.id] || {};
    $("d-title").textContent = r.managed ? s.id : (r.label || s.id);
    $("d-body").innerHTML = r.managed ? `
      <div class="evidence">${esc(info.hardware)} · serial ${esc(info.serial)} · ${esc(info.mode)} mode<br>Bias tee: ${info.bias_tee_fixed === true ? "permanently on" : info.bias_tee_supported ? "available" : "not available / kept off"}<br>
      Health comes from the broker (USB, IQ checks, failures). Run by the broker, so it can't be renamed or removed here.</div>
      <div class="field"><label>Notes</label><textarea data-rf="notes" maxlength="2000">${esc(r.notes)}</textarea></div>` : `
      <div class="evidence">Not run by the broker. Its health is whatever you set here.</div>
      <div class="field"><label>Is it working?</label>${seg("rxstatus", S.data.statuses, r.status || "unknown", STATUS_LABEL)}</div>
      <div class="field"><label>Name</label><input data-rf="label" value="${esc(r.label)}" maxlength="80"></div>
      <div class="row2"><div class="field"><label>Serial</label><input data-rf="serial" value="${esc(r.serial)}" maxlength="64"></div>
      <div class="field"><label>Host</label><input data-rf="host" value="${esc(r.host)}" maxlength="120"></div></div>
      <div class="field"><label>Hardware</label><input data-rf="hardware" value="${esc(r.hardware)}" maxlength="120"></div>
      <div class="field"><label>Notes</label><textarea data-rf="notes" maxlength="2000">${esc(r.notes)}</textarea></div>
      <button class="btn danger" data-del-rx>Remove this receiver</button> <span class="muted" style="font-size:12px">Its parts go back to the bin.</span>`;
  }
}
async function renderHistory() {
  $("d-title").textContent = "History";
  $("d-body").innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const h = await api("/v1/rf/history");
    $("d-body").innerHTML = h.versions.map((v) => `<div class="hist"><div class="hh"><b>v${v.version}</b><span class="muted" style="font-size:12.5px">${esc(when(v.saved_at))} · ${esc(v.author)}</span></div>
      ${v.note ? `<div style="font-size:13px">${esc(v.note)}</div>` : ""}<ul>${(v.changes || []).slice(0, 12).map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
      ${v.version !== S.base ? `<button class="btn small" data-restore="${v.version}">Load this version</button>` : `<span class="tag ok">current</span>`}</div>`).join("");
  } catch (e) { $("d-body").innerHTML = `<p>${esc(e.message)}</p>`; }
}

// ------------------------------------------------------------------ drag and drop (mouse + touch)
let drag = null;
document.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 && e.pointerType === "mouse") return;
  const handle = e.target.closest("[data-chip-handle]");
  const el = handle ? handle.closest("[data-chip]") : e.target.closest(".chip[data-chip]");
  if (!el || e.target.closest(".drawer")) return;
  drag = {cid: el.dataset.chip, el, x: e.clientX, y: e.clientY, started: false, ghost: null, over: null};
});
document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    drag.started = true;
    document.body.classList.add("dragging");
    const g = drag.el.classList.contains("switchbox") ? drag.el.querySelector(".sw-h").cloneNode(true) : drag.el.cloneNode(true);
    g.classList.add("ghost", "chip", `k-${comps()[drag.cid].kind}`);
    document.body.appendChild(g);
    drag.ghost = g;
  }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX + 8) + "px";
  drag.ghost.style.top = (e.clientY + 8) + "px";
  const t = document.elementFromPoint(e.clientX, e.clientY);
  const zone = t && (t.closest("[data-drop=port]") || t.closest("[data-drop=slot]") || t.closest("[data-drop=lane]") || t.closest("[data-drop=bin]"));
  if (drag.over !== zone) { drag.over?.classList.remove("over"); zone?.classList.add("over"); drag.over = zone; }

      lineChart($("c-ov"), {x: c.overlay.freqs_hz, xFmt: (v) => (v / 1e6).toFixed(4), xLabel: "MHz", yLabel: "dBFS/Hz",
        series: [{y: c.overlay.a_dbfs_per_hz, color: "var(--ink-2)", width: 1.2}, {y: c.overlay.b_dbfs_per_hz, color: "var(--accent)", width: 1.2}]});
      lineChart($("c-diff"), {x: c.overlay.freqs_hz, xFmt: (v) => (v / 1e6).toFixed(4), xLabel: "MHz", yLabel: "dB", series: [{y: c.overlay.diff_db, color: "var(--k-amplifier)", width: 1.2}], hlines: [{y: 0, color: "var(--ink-2)"}]});
    }
    const [lo, hi] = c.waterfalls.shared_scale_dbfs;
    const view = c.overlay ? [c.overlay.freqs_hz[0], c.overlay.freqs_hz[c.overlay.freqs_hz.length - 1]] : null;
    const wa = waterfall($("c-wa"), c.waterfalls.a, {view, target: c.a.radio.target_frequency_hz});
    const wb = waterfall($("c-wb"), c.waterfalls.b, {view, target: c.b.radio.target_frequency_hz});
    const shared = [Math.max(lo, Math.min(wa.st.lo, wb.st.lo)), Math.min(hi, Math.max(wa.st.hi, wb.st.hi))];
    wa.setRange(...shared); wb.setRange(...shared);      // identical color scale on both
  }

      <div class="card"><h4>Saved baselines</h4><table class="t">${d.baselines.map(trow).join("") || "<tr><td>None yet. Any test becomes a baseline when another test is compared against it.</td></tr>"}</table></div>
      <div class="card"><h4>A/B comparisons</h4><table class="t">${d.comparisons.map((p) => `<tr class="clk" data-pair="${esc(p.a)}|${esc(p.b)}|${esc(p.type)}"><td>${esc(when(p.recorded))}</td><td><span class="tag">${esc(TYPE_LABEL[p.type] || p.type)}</span> ${esc(p.name || p.b)}</td><td>${esc(p.receiver)}</td></tr>`).join("") || "<tr><td>None yet.</td></tr>"}</table></div>
      <div class="card"><h4>Detected anomalies</h4><table class="t">${d.anomalies.map((a) => `<tr class="clk" data-open-test="${esc(a.test_id)}"><td><span class="tag ${a.severity === "high" ? "fault" : "warn"}">${esc(a.severity)}</span></td><td>${esc(a.title)}${a.frequency_hz ? ` · ${MHz(a.frequency_hz, 4)}` : ""}</td><td>${esc(a.receiver)}</td></tr>`).join("") || "<tr><td>No medium or high-severity anomalies in recent investigations.</td></tr>"}</table></div>
      <div class="card"><h4>Satellite decoding results</h4><table class="t">${d.satellite.map((x) => `<tr class="clk" data-open-test="${esc(x.test_id)}"><td>${esc(when(x.recorded))}</td><td>${x.type === "sat_compare" ? `pass comparison · ${esc(x.name)}` : `${esc(x.receiver)} · ${esc(x.highest || "no evidence")} · ${x.frames} frames`}</td></tr>`).join("") || "<tr><td>None yet.</td></tr>"}</table></div>
      <div class="card"><h4>Component performance</h4><table class="t">${d.components.map((c) => `<tr class="clk" data-perf-open="${esc(c.id)}"><td>${esc(c.name)}</td><td>${esc(c.kind || "")}</td><td class="num">${c.tests} test(s)</td></tr>`).join("") || "<tr><td>No part has been tested yet.</td></tr>"}</table></div>
      </div>`;
  }
  $("lab").addEventListener("click", (e) => {
    const t = e.target;
    const pr = t.closest("[data-pair]");
    if (pr) { const [a, b, kind] = pr.dataset.pair.split("|"); return kind === "scan" ? openScanCompare(a, b) : openCompare(a, b); }
    const po = t.closest("[data-perf-open]");
    if (po) return openPerformance(po.dataset.perfOpen);
    const ac = t.closest("[data-ant-cmp]");
    if (ac) return antennaCompare(ac.dataset.antCmp, $("ant-b").value);
    if (t.closest('[data-dash="all"]')) return openHistory();
  });
  window.addEventListener("resize", () => { if (L.view === "test" && L.detail?.metrics) renderTab(); });
  return {openTest, openScan, openScanCompare, openTermination, openGainSweep, openSatellite, openPerformance, openDashboard, partPerformanceCompact, openHistory, openResult, openCompare, partTests, offerAfterSave, offerBanner,
          dismiss() { L.offer = []; render(); }, get open() { return $("lab").classList.contains("open"); }};
})();

window.addEventListener("beforeunload", (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });
load(true).catch(() => {});
setInterval(() => { if (!drag && document.visibilityState === "visible") load(false).catch(() => {}); }, 30000);
</script>
</body>
</html>
