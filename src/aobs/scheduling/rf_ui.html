<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Paths · Starlab Observatory</title>
<style>
:root {

    --ok-bg: #16301f; --warn-bg: #33290f; --bad-bg: #3a1a1a; --unk-bg: #242a33;
    --k-antenna: #5b8ff0; --k-filter: #a68af8; --k-amplifier: #f0884a; --k-switch: #2bb5a7; --k-other: #9aa3ad;

}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --ink: #e8ebef; --ink-2: #9aa4b0; --line: #2d333d;
  --accent: #5b8ff0; --ok: #3fbf74; --warn: #e3a72a; --bad: #f06a6a; --unk: #7d8794;
  --ok-bg: #16301f; --warn-bg: #33290f; --bad-bg: #3a1a1a; --unk-bg: #242a33;
  --k-antenna: #5b8ff0; --k-filter: #a68af8; --k-amplifier: #f0884a; --k-switch: #2bb5a7; --k-other: #9aa3ad;

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);

.ver { color: var(--ink-2); font-size: 12.5px; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }

.btn.danger { color: var(--bad); }

.chip.shared { opacity: .55; cursor: default; box-shadow: none; border-style: dashed; }
.feedtag { flex: none; font-size: 11.5px; color: var(--ink-2); padding: 0 8px; white-space: nowrap; }

.chip:hover { border-color: var(--kc); }

.chip .txt { min-width: 0; flex: 1; display: block; }
.chip .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; font-size: 13px; }
.chip .sub { display: block; font-size: 11px; color: var(--ink-2); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip svg { flex: none; color: var(--kc); }
.chip.broken { background: var(--bad-bg); }
.chip.suspect { background: var(--warn-bg); }
.k-antenna { --kc: var(--k-antenna); } .k-filter { --kc: var(--k-filter); } .k-amplifier { --kc: var(--k-amplifier); }
.k-switch { --kc: var(--k-switch); } .k-splitter, .k-attenuator, .k-cable, .k-other { --kc: var(--k-other); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--unk); }
.dot.working, .dot.ok { background: var(--ok); } .dot.suspect, .dot.warn { background: var(--warn); }
.dot.broken, .dot.fault { background: var(--bad); }
.lanes { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lane { padding: 0; overflow: hidden; }
.lane-h { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.lane-h .dot { width: 12px; height: 12px; margin-top: 4px; }

.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.fault { background: var(--bad-bg); color: var(--bad); }
.flow { display: flex; align-items: center; gap: 0; padding: 14px; overflow-x: auto; min-height: 76px; }
.flow.over { background: var(--panel-2); }
.slot { flex: none; width: 22px; align-self: stretch; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: width .12s; }
.slot::before { content: ""; width: 14px; height: 2px; background: var(--line); }
body.dragging .slot { width: 40px; }
body.dragging .slot::before { width: 4px; height: 36px; border-radius: 2px; background: var(--line); }
.slot.over { background: var(--panel-2); }
.slot.over::before { background: var(--accent) !important; }
.rxblock { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px;
  background: var(--panel-2); border: 1px solid var(--line); font-weight: 650; white-space: nowrap; }
.empty-flow { color: var(--ink-2); font-size: 13px; padding: 0 6px; white-space: nowrap; }
.pathtext { font-size: 12px; color: var(--ink-2); padding: 0 14px 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word; }
.lanewarn { font-size: 12.5px; color: var(--warn); padding: 0 14px 10px; }
.switchbox { flex: none; border: 1px solid var(--line); border-left: 4px solid var(--k-switch); border-radius: 10px; background: var(--panel); padding: 8px; box-shadow: var(--shadow); }
.switchbox .sw-h { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; cursor: grab; touch-action: none; font-weight: 600; font-size: 13px; color: var(--k-switch); }
.port { display: flex; align-items: center; gap: 8px; padding: 3px; border-radius: 7px; min-height: 38px; }
.port .pn { width: 22px; text-align: right; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.port .pe { font-size: 12px; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 7px; padding: 6px 10px; min-width: 140px; }
.port.over { background: var(--panel-2); outline: 2px dashed var(--accent); }
.port.active .pn { color: var(--k-switch); font-weight: 700; }
.board { font-size: 12px; margin-top: 8px; padding: 6px 8px; border-radius: 7px; max-width: 260px; }
.board.ok { background: var(--ok-bg); color: var(--ok); }
.board.warn { background: var(--warn-bg); color: var(--warn); }
.board .btn { margin-top: 6px; }
.ghost { position: fixed; z-index: 100; pointer-events: none; opacity: .9; transform: rotate(-2deg); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.drawer { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.15); transform: translateX(105%); transition: transform .18s;
  display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.drawer-h h3 { margin: 0; font-size: 16px; flex: 1; }
.drawer-b { padding: 14px 16px 24px; overflow: auto; flex: 1; }
.drawer-f { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel-2); }
.drawer-f[hidden] { display: none; }
.drawer-f .msg { flex: 1; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.drawer-f .msg.err { color: var(--bad); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 7px 9px; }
.field textarea { min-height: 70px; resize: vertical; }
.field input[type=checkbox] { width: auto; margin-right: 6px; vertical-align: -2px; }
.cfkinds { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--panel); padding: 6px 4px; font-size: 12.5px; border-right: 1px solid var(--line); display: flex; gap: 5px; align-items: center; justify-content: center; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--panel-2); font-weight: 650; }
.evidence { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 12px; }
.hist { border-bottom: 1px solid var(--line); padding: 10px 0; }
.hist .hh { display: flex; gap: 8px; align-items: baseline; }
.hist .hh b { font-size: 13.5px; }
.hist ul { margin: 4px 0 6px 18px; padding: 0; font-size: 12.5px; color: var(--ink-2); }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 40; display: none; }
.scrim.open { display: block; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 200; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }
.signin { max-width: 520px; margin: 60px auto; padding: 24px; }
.muted { color: var(--ink-2); }
.savebox { display: flex; gap: 6px; align-items: center; }
.savebox input { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 6px 9px; width: 220px; }
@media (max-width: 600px) { .savebox input { width: 140px; } .top h1 { font-size: 15px; } .top h1.brand img { height: 32px; }
  .flow { flex-wrap: wrap; row-gap: 8px; overflow-x: visible; padding: 12px 10px; } .layout { padding: 12px; } }
.testbtn { margin-left: 10px; vertical-align: 1px; }
.testmenu { position: fixed; z-index: 70; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 4px; width: 300px; }
.testmenu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; }
.testmenu button:hover, .testmenu button:focus { background: var(--panel-2); }
.testmenu span { display: block; font-size: 12px; color: var(--ink-2); }
.lab { position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(1080px, 100vw); background: var(--bg);
  border-left: 1px solid var(--line); box-shadow: -10px 0 40px rgba(0,0,0,.2); display: none; flex-direction: column; }
.lab.open { display: flex; }
.lab-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.lab-h h3 { margin: 0; font-size: 16px; flex: 1; }
.lab-b { overflow: auto; padding: 16px; flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.vpath { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 13.5px; }

.vpath .ar { color: var(--ink-2); padding-left: 18px; line-height: 1; }
.vpath .rxst { border-left-color: var(--ink-2); font-weight: 650; }
.rxcard { margin-bottom: 10px; }
.rxcard .rxh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.rxcard .rxh b { font-size: 14.5px; }
h4.sect { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.chips-sel { display: flex; flex-wrap: wrap; gap: 6px; }

.chips-sel button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.s-SCHEDULED, .s-RESERVED { background: var(--accent) !important; } .s-RECORDING { background: var(--ok) !important; }

</head>

  if (on) S.shelf.add(rid); else S.shelf.delete(rid);
  try { localStorage.setItem(SHELF_KEY, JSON.stringify([...S.shelf])); } catch {}
  render();
  const r = rxs()[rid] || {}, name = r.managed ? rid : (r.label || rid);
  toast(on ? `${name} shelved — hidden on this page only, nothing else changes. Click it in the sidebar to bring it back.` : `${name} is back`);
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const dirty = () => S.layout && JSON.stringify(S.layout) !== S.saved;

// ------------------------------------------------------------------ draft (unsaved edits survive reloads, crashes and shutdowns)
const DRAFT_KEY = "aobs.rf.draft.v1";
function writeDraft() {
  if (!S.layout) return;                 // not loaded yet (or signed out): never touch a stored draft
  try {
    if (dirty()) localStorage.setItem(DRAFT_KEY, JSON.stringify({layout: S.layout, base: S.base, note: $("note").value, at: new Date().toISOString()}));
    else localStorage.removeItem(DRAFT_KEY);
  } catch (e) { /* storage blocked: the beforeunload warning is all that's left */ }
}
function readDraft() {
  try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); return d && d.layout && d.layout.components ? d : null; }
  catch (e) { return null; }
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
function gainText(r) {
  const ge = r.gain_elements;
  if (r.gain_db != null) return `${r.gain_db} dB`;
  if (ge && "IFGR" in ge || ge && "RFGR" in ge) return `IFGR ${ge.IFGR ?? "AGC"} · RFGR ${ge.RFGR}${r.agc ? " · AGC" : ""}`;
  if (ge) return Object.entries(ge).map(([k, v]) => `${k} ${v}`).join(" · ") + " dB";
  return "auto";
}
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString(undefined, {weekday: "short", hour: "2-digit", minute: "2-digit", month: "short", day: "numeric"});
}

async function api(path, opts = {}) {
  const r = await fetch(path, {credentials: "same-origin", ...opts,
    headers: {"Content-Type": "application/json", "X-AOBS-RF": "1", ...(opts.headers || {})}});
  if (r.status === 401) { S.signin = true; render(); throw new Error("not signed in"); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 404 && j.detail === "Not Found")      // the route itself is missing, not a missing record
    throw new Error("The broker is running older code than this page and doesn't have this feature yet. "
                    + "Restart it (sudo systemctl restart observatory-broker) and try again.");
  if (!r.ok) throw new Error(j.error || j.detail || r.statusText);
  return j;
}

// ------------------------------------------------------------------ loading
async function load(replace, restoreDraft) {
  const d = await api("/v1/rf");
  S.signin = false;
  const changedOnServer = S.data && d.version !== S.base;
  S.data = d;
  if (replace || !S.layout || (!dirty() && changedOnServer)) {
    S.layout = clone(d.layout); S.base = d.version; S.saved = JSON.stringify(d.layout); S.conflict = null;
    S.check = {errors: [], warnings: d.warnings || []};
    const dr = restoreDraft && readDraft();
    if (dr && JSON.stringify(dr.layout) !== S.saved) {
      S.layout = dr.layout;
      if (dr.note) $("note").value = dr.note;
      S.restored = {at: dr.at, from: dr.base, now: d.version};
      changed();
      return;
    }
    writeDraft();                        // an explicit reload/save replaced the edits: drop the stale draft
  } else if (changedOnServer && dirty()) {
    S.conflict = d.version;
  }
  render();
}

let checkTimer = null;
function changed() {
  writeDraft();
  render();
  clearTimeout(checkTimer);
  if (!dirty()) { S.check = {errors: [], warnings: S.data.warnings || []}; render(); return; }
  checkTimer = setTimeout(async () => {
    try {
      const r = await api("/v1/rf", {method: "POST", body: JSON.stringify({layout: S.layout, base_version: S.base, dry_run: true})});
      S.check = {errors: r.errors || [], warnings: r.warnings || []};
      if (r.derived) S.data.derived = r.derived;
    } catch (e) { S.check = {errors: [String(e.message || e)], warnings: []}; }
    render();
  }, 250);
}

// ------------------------------------------------------------------ model helpers
const comps = () => S.layout.components;
const rxs = () => S.layout.receivers;
const SW = () => S.data.switch_id;
// A receiver fed from a splitter: the path up to that splitter (from the receiver whose chain holds it) + its own parts
function upstream(rid, seen = new Set()) {
  const r = rxs()[rid];
  if (!r || !r.feed || seen.has(rid)) return [];
  const owner = Object.keys(rxs()).find((x) => rxs()[x].chain.includes(r.feed));
  if (!owner || owner === rid) return [];
  seen.add(rid);
  const full = [...upstream(owner, seen), ...rxs()[owner].chain];
  return full.slice(0, full.indexOf(r.feed) + 1);
}
const fedBy = (sid) => Object.keys(rxs()).filter((x) => rxs()[x].feed === sid);
const ownerOf = (cid) => Object.keys(rxs()).find((x) => rxs()[x].chain.includes(cid));
function dropFeeds(ids) {
  const gone = Object.keys(rxs()).filter((x) => ids.includes(rxs()[x].feed));
  for (const x of gone) rxs()[x].feed = null;
  if (gone.length) toast(`${gone.join(", ")} no longer fed from ${ids.map((i) => comps()[i]?.name || i).join(", ")}`);
}
function where(cid) {
  for (const [rid, r] of Object.entries(rxs())) { const i = r.chain.indexOf(cid); if (i >= 0) return {type: "lane", rx: rid, index: i}; }
  for (const c of Object.values(comps())) if (c.kind === "switch") for (const [p, a] of Object.entries(c.ports || {})) if (a === cid) return {type: "port", sw: c.id, port: p};
  return {type: "bin"};
}
function detach(cid) {
  const w = where(cid);
  if (w.type === "lane") rxs()[w.rx].chain.splice(w.index, 1);
  if (w.type === "port") comps()[w.sw].ports[w.port] = null;
}
const isHead = (cid) => cid && ["antenna", "switch"].includes(comps()[cid]?.kind);
function placeLane(cid, rid, index) {
  const c = comps()[cid];
  if (c.kind === "rotator") { toast("A rotator turns an antenna; choose it on the antenna instead"); return false; }
  if (c.id === SW() && rid !== S.data.switch_receiver) { toast(`${c.name} is wired to ${S.data.switch_receiver} only`); return false; }
  if (isHead(cid) && rxs()[rid].feed) { toast(`${rid} is fed from ${comps()[rxs()[rid].feed]?.name}; remove that feed first (click the receiver)`); return false; }
  if (c.kind === "splitter" && upstream(rid).includes(cid)) { toast("That splitter already feeds this receiver"); return false; }
  const prev = where(cid);
  if (c.kind === "splitter" && prev.type === "lane" && prev.rx !== rid && fedBy(cid).includes(rid)) { toast(`${rid} is fed from ${c.name}; it can't also hold it`); return false; }
  const before = where(cid);
  detach(cid);
  const chain = rxs()[rid].chain;
  if (before.type === "lane" && before.rx === rid && before.index < index) index -= 1;
  if (c.kind === "antenna" || c.kind === "switch") {
    if (isHead(chain[0])) {
      const out = chain.shift();
      if (comps()[out].kind === "switch" && rid === S.data.switch_receiver && c.kind === "antenna") {
        chain.unshift(out); toast(`${rid} is driven through ${out}; drop antennas on its ports`); attachBack(cid, before); return false;
      }
      toast(`${comps()[out].name} moved to the parts bin`);
    }
    chain.unshift(cid);
  } else {
    if (isHead(chain[0])) index = Math.max(index, 1);
    chain.splice(Math.min(index, chain.length), 0, cid);
  }
  return true;
}
function attachBack(cid, w) {
  if (w.type === "lane") rxs()[w.rx].chain.splice(w.index, 0, cid);
  if (w.type === "port") comps()[w.sw].ports[w.port] = cid;
}
function placePort(cid, sw, port) {
  const c = comps()[cid];
  if (c.kind !== "antenna") { toast("Only antennas go on switch ports"); return false; }
  if (comps()[sw]?.ports?.[port] === undefined) return false;
  detach(cid);
  const occ = comps()[sw].ports[port];
  if (occ && occ !== cid) toast(`${comps()[occ].name} moved to the parts bin`);
  comps()[sw].ports[port] = cid;
  return true;
}
function toBin(cid) {
  const c = comps()[cid];
  if (cid === SW() && where(cid).type === "lane" && where(cid).rx === S.data.switch_receiver) { toast(`${S.data.switch_receiver} needs ${c.name}; it can't be removed here`); return false; }
  if (c.kind === "splitter") dropFeeds([cid]);
  detach(cid); return true;
}

// ------------------------------------------------------------------ health
function rxHealth(rid) {
  const r = rxs()[rid];
  const chainBad = [...upstream(rid), ...r.chain].map((c) => comps()[c]).filter((c) => c && (c.status === "broken" || c.status === "suspect"));
  const reasons = [];
  let level = "ok";
  const bump = (l) => { const o = {ok: 0, unknown: 1, warn: 2, fault: 3}; if (o[l] > o[level]) level = l; };
  if (!r.managed) {
    const st = r.status || "unknown";
    reasons.push({text: `Documentation only: Starlab never opens it${r.host ? " · " + r.host : ""}`, cls: ""});
    bump({working: "ok", suspect: "warn", broken: "fault", unknown: "unknown"}[st]);
  } else {
    const st = (S.data.status || {})[rid] || {};
    if (st.connected === false) { bump("fault"); reasons.push({text: "Not on USB", cls: "fault"}); }
    else if (st.connected) reasons.push({text: "USB connected", cls: "ok"});
    else if (st.presence) { bump("unknown"); reasons.push({text: {api_unavailable: "SDRplay API service down", discovery_deferred: "USB check deferred (recording window)", re_enumerating: "Re-enumerating on USB"}[st.presence.reason] || "USB presence unknown", cls: "warn"}); }
    if (st.state) reasons.push({text: st.state, cls: /RECORDING/.test(st.state) ? "ok" : ""});
    const ses = (S.data.sessions || {})[rid];
    if (ses) reasons.push({text: `SDR++ server ${ses.connect_to} · ${ses.clients || 0} client(s) · until ${new Date(ses.ends_at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}`, cls: "warn"});
    const inf = (S.data.receiver_info || {})[rid] || {};
    if (inf.state === "simulated" || inf.driver === "sim") reasons.push({text: "Simulated · no hardware", cls: ""});
    else if (inf.state === "verified") reasons.push({text: "Verified", cls: "ok"});
    else if (inf.readiness === "failed") { bump("warn"); reasons.push({text: "Configured · last hardware test failed", cls: "fault"}); }
    else if (inf.in_service) reasons.push({text: "Configured · in service, not yet verified", cls: ""});
    else { bump("warn"); reasons.push({text: "Configured · not verified: tests only", cls: "warn"}); }
    const iq = st.iq_health;
    if (iq) {
      const cls = ["suspicious_flat", "capture_failure"].includes(iq.status) ? "fault" : iq.status === "healthy" ? "ok" : "warn";
      bump(cls === "ok" ? "ok" : cls);
      reasons.push({text: `IQ: ${iq.label}${iq.rms_dbfs != null ? " (" + iq.rms_dbfs.toFixed(1) + " dBFS)" : ""} · ${when(iq.at)}`, cls});
    } else if (S.data.receiver_info[rid]?.driver === "rtlsdr") reasons.push({text: "IQ: not assessed yet", cls: ""});
    if (st.last_error) { bump("warn"); reasons.push({text: `Last failure: ${st.last_error.target || st.last_error.job_name} ${when(st.last_error.record_start)}`, cls: "warn"}); }
  }
  for (const c of chainBad) { bump(c.status === "broken" ? "fault" : "warn"); reasons.push({text: `${c.name}: ${STATUS_LABEL[c.status]}`, cls: c.status === "broken" ? "fault" : "warn"}); }
  if (!isHead([...upstream(rid), ...r.chain][0])) { bump("warn"); reasons.push({text: "No antenna connected", cls: "warn"}); }
  return {level, reasons};
}

// ------------------------------------------------------------------ rendering
function chip(cid, extra = "") {
  const c = comps()[cid];
  if (!c) return "";
  const sub = [c.kind === "filter" && c.filter_type && c.filter_type !== "other" ? FILTER_LABEL[c.filter_type] : "",
    c.kind === "antenna" && c.polarization && c.polarization !== "unknown" ? POL_LABEL[c.polarization] : "", c.model,
    c.kind === "amplifier" && c.gain_db != null ? `+${c.gain_db} dB` : "", c.kind === "splitter" ? `${c.outputs || 2} outputs` : "",
    c.power !== "none" ? POWER_LABEL[c.power] : ""].filter(Boolean).join(" · ");
  return `<button class="chip k-${c.kind} ${c.status} ${S.sel?.type === "part" && S.sel.id === cid ? "sel" : ""}" data-chip="${esc(cid)}" ${extra} title="${esc(c.name)} — ${STATUS_LABEL[c.status]}">
    ${ICON[c.kind] || ICON.other}<span class="txt"><span class="nm">${esc(c.name)}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span><span class="dot ${c.status}"></span></button>`;
}
function switchBox(cid, rid) {
  const c = comps()[cid];
  const st = (S.data.status || {})[rid] || {};
  const manual = cid !== SW();
  const ports = Object.keys(c.ports).sort((a, b) => a - b).map((p) => {
    const a = c.ports[p], on = manual && String(c.selected_port) === p;
    return `<div class="port ${on ? "active" : ""}" data-drop="port" data-sw="${esc(cid)}" data-port="${p}">${manual ? `<button class="sel ${on ? "on" : ""}" data-sel-port="${esc(cid)}|${p}" title="${on ? "Connected now" : "Set the switch to this port"}" aria-label="Port ${p}${on ? " (selected)" : ""}"></button>` : ""}<span class="pn">${p}</span>${a ? chip(a) : `<span class="pe">empty port</span>`}</div>`;
  }).join("");
  return `<div class="switchbox" data-chip="${esc(cid)}"><div class="sw-h" data-chip-handle="${esc(cid)}">${ICON.switch}<span>${esc(c.name)}</span><span class="dot ${c.status}"></span></div>${ports}${manual ? `<div class="muted" style="font-size:11.5px;margin-top:4px;max-width:240px">Manual switch: mark the port it is set to.</div>` : boardLine()}</div>`;
}
function boardLine() {
  const b = S.data.switch_board || {};
  if (!b.available) return "";
  if (!b.reachable) return `<div class="board warn">Switch board unreachable: ${esc(b.error || "")}</div>`;
  if (b.in_sync) return `<div class="board ok">✓ The switch board (antswitch.local) has these names</div>`;
  const d = (b.differences || []).map((x) => x.board === x.layout
    ? `port ${x.port}: board label "${x.board_label || ""}"` : `port ${x.port}: board says ${x.board || "empty"}`).join("; ");
  return `<div class="board warn">The switch board differs: ${esc(d)}.
    ${dirty() ? "<br>Save first, then send." : `<br><button class="btn small" data-push-switch>Send these names to the switch</button>`}</div>`;
}
function lane(rid) {
  const r = rxs()[rid];
  const info = (S.data.receiver_info || {})[rid] || {};
  const h = rxHealth(rid);
  const label = r.managed ? rid : (r.label || rid);
  const meta = r.managed ? [info.hardware, `serial ${info.serial}`, info.mode && `${info.mode} mode`].filter(Boolean).join(" · ")
    : [r.hardware, r.serial && `serial ${r.serial}`].filter(Boolean).join(" · ");
  let flow = "";
  const up = upstream(rid);
  if (r.feed) {
    flow += up.length ? up.map((cid) => (comps()[cid]?.kind === "switch" ? `<span class="chip shared k-switch">${ICON.switch}<span class="txt"><span class="nm">${esc(comps()[cid].name)}</span></span></span>` : chip(cid).replace('<button class="chip', '<span class="chip shared').replace(/data-chip="[^"]*"/, "").replace(/<\/button>$/, "</span>"))).join(`<span class="slot"></span>`)
      : `<span class="empty-flow">${esc(comps()[r.feed]?.name || r.feed)} is not in a path</span>`;
    flow += `<span class="feedtag">output of ${esc(comps()[r.feed]?.name || r.feed)} · shared with ${esc(ownerOf(r.feed) || "?")}</span>`;
  }
  r.chain.forEach((cid, i) => {
    flow += `<div class="slot" data-drop="slot" data-rx="${esc(rid)}" data-index="${i}"></div>`;
    flow += comps()[cid]?.kind === "switch" ? switchBox(cid, rid) : chip(cid);
  });
  flow += `<div class="slot" data-drop="slot" data-rx="${esc(rid)}" data-index="${r.chain.length}"></div>`;
  if (!r.chain.length && !r.feed) flow += `<span class="empty-flow">Drag an antenna here</span><div class="slot" data-drop="slot" data-rx="${esc(rid)}" data-index="0"></div>`;
  flow += `<div class="rxblock">${ICON.receiver}${esc(label)}</div>`;
  const derived = (S.data.derived || {})[rid];
  const laneWarn = S.check.warnings.filter((w) => w.startsWith(rid + " ") || w.startsWith(rid + ":") || w.startsWith(rid + "'s"));
  return `<section class="panel lane" data-rx-lane="${esc(rid)}">
    <div class="lane-h" data-open-rx="${esc(rid)}"><span class="dot ${h.level}"></span><div style="min-width:0;flex:1">
      <div class="title">${esc(label)}${r.managed ? "" : ` <span class="tag">documentation only</span>`}${r.managed ? `<button class="btn small testbtn" data-test-menu="${esc(rid)}" aria-haspopup="menu">Test ▾</button>` : ""}</div>
      <div class="meta">${esc(meta)}</div>
      <div class="facts">${h.reasons.map((x) => `<span class="tag ${x.cls}">${esc(x.text)}</span>`).join("")}</div>
      ${r.notes ? `<div class="meta" style="margin-top:3px">${esc(r.notes)}</div>` : ""}
    </div><div class="lane-tools"><span data-lane-grip="${esc(rid)}" title="Drag to the sidebar to shelve this receiver">⠿</span><button data-shelve="${esc(rid)}" title="Shelve: hide this lane (view only — recording is not affected)" aria-label="Shelve ${esc(label)}">–</button></div></div>
    <div class="flow" data-drop="lane" data-rx="${esc(rid)}">${flow}</div>
    ${derived ? `<div class="pathtext">Recorded as: ${esc(derived.signal_path)}</div>` : ""}
    ${laneWarn.map((w) => `<div class="lanewarn">⚠ ${esc(w)}</div>`).join("")}
  </section>`;
}
function shelfBody() {
  const ids = [...S.shelf].filter((r) => rxs()[r]).sort();
  if (!ids.length) return "";
  return `<div class="group" style="margin-top:16px">Shelved receivers</div><div class="chips">${ids.map((rid) => {
    const r = rxs()[rid], h = rxHealth(rid), label = r.managed ? rid : (r.label || rid);
    return `<button class="chip shelfrx" data-unshelf="${esc(rid)}" title="${esc(label)} — click or drag back to show its lane. Shelving only hides it here; it still records.">${ICON.receiver}<span class="txt"><span class="nm">${esc(label)}</span></span><span class="dot ${h.level}"></span></button>`;
  }).join("")}</div>`;
}
function bin() {
  const loose = Object.values(comps()).filter((c) => where(c.id).type === "bin");
  const groups = {};
  for (const c of loose) (groups[c.kind] ||= []).push(c);
  const order = ["antenna", "filter", "amplifier", "switch", "splitter", "attenuator", "cable", "connector", "rotator", "other"];
  const body = order.filter((k) => groups[k]).map((k) => `<div class="group">${KIND_LABEL[k]}</div><div class="chips">${groups[k].sort((a, b) => a.name.localeCompare(b.name)).map((c) => chip(c.id)).join("")}</div>`).join("");
  return `<aside class="panel bin" data-drop="bin"><h2>Parts bin</h2>
    ${body || `<div class="muted" style="font-size:13px">Everything is connected. Drag a part here to disconnect it.</div>`}
    ${shelfBody()}
    <div class="addrow" style="margin-top:14px"><button class="btn small" data-new-part>+ New part</button><button class="btn small" data-new-rx>+ Documentation-only device</button></div>
    <div class="binhint">Drag parts onto a receiver's path, between parts, or onto a switch port. Click a part to set whether it's working. To add a receiver Starlab can record with, use <b>Receivers</b> at the top.</div></aside>`;
}
function render() {
  if (S.signin) {
    $("app").innerHTML = `<div class="panel signin"><h2 style="margin-top:0">Sign in</h2><p>This page needs a sign-in link. On the computer Starlab runs on, run <code>starlab web-link</code> and open the link it prints.</p>
      <p>If the Slack bot is set up, you can also ask it for <i>"the RF editor link"</i>. A link works for 15 minutes; after that this browser stays signed in for 30 days.</p></div>`;
    return;
  }
  if (!S.data) { $("app").innerHTML = `<p class="muted" style="padding:16px">Loading…</p>`; return; }
  const managed = Object.keys(rxs()).filter((r) => rxs()[r].managed).sort();
  const ext = Object.keys(rxs()).filter((r) => !rxs()[r].managed).sort();
  const shown = [...managed, ...ext].filter((r) => !S.shelf.has(r));
  $("app").innerHTML = `<div class="layout">${bin()}<main class="lanes" data-drop="lanes">${shown.map(lane).join("") || `<p class="muted" style="padding:8px 4px">All receivers are shelved. Click one in the sidebar to bring it back.</p>`}</main></div>`;
  $("ver").textContent = `v${S.base} · saved ${when(S.data.saved_at)} by ${S.data.author}`;
  saveUi();
  const b = [];
  if (S.restored && dirty()) b.push(`<div class="banner warn">Restored the unsaved changes you were making ${esc(when(S.restored.at))}. They aren't live until you press Save.${S.restored.from !== S.restored.now
    ? ` They were made on v${S.restored.from}; v${S.restored.now} has been saved since, so check them before saving — saving replaces v${S.restored.now}.` : ""}</div>`);
  if (typeof Lab !== "undefined") { const ob = Lab.offerBanner(); if (ob) b.push(ob); }
  if (S.conflict) b.push(`<div class="banner err">Version ${S.conflict} was saved somewhere else while you were editing. <button class="btn small" data-reload>Reload it</button> (discards your unsaved changes)</div>`);
  if (S.check.errors.length) b.push(`<div class="banner err"><b>Can't save yet:</b><ul>${S.check.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>`);
  const general = S.check.warnings.filter((w) => !Object.keys(rxs()).some((r) => w.startsWith(r + " ") || w.startsWith(r + ":") || w.startsWith(r + "'s")));
  if (general.length) b.push(`<div class="banner warn"><ul>${general.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>`);
  $("banners").innerHTML = b.join("");
  if (S.sel) renderDrawer();
}

function saveUi() {
  const d = dirty(), errs = S.check.errors.length;
  $("dirty").hidden = !d;
  $("b-discard").hidden = !d;
  if (!d) { delete $("b-discard").dataset.armed; $("b-discard").textContent = "Cancel"; }
  $("b-save").disabled = !d || errs > 0;
  $("d-foot").hidden = !d || S.sel?.type === "history";
  $("d-save").disabled = !d || errs > 0;

      : `<div class="field"><label>IF bandwidth</label><select data-lf="bandwidth_hz">${o.capabilities.bandwidth_hz_values.map((b) => `<option value="${b}" ${Number(f.bandwidth_hz) === b ? "selected" : ""}>${b >= 1e6 ? (b / 1e6) + " MHz" : (b / 1e3) + " kHz"}</option>`).join("")}</select></div>`;
    body().innerHTML = (L.mode === "interference" ? investigationCard() : "") + `

        <div class="muted" style="font-size:12.5px">${base ? `After this recording you'll see it side by side with <b>${esc(base.name || base.test_id)}</b>. For a fair comparison keep the same frequency, gain, sample rate, duration and antenna pointing. Settings below were copied from it.` : "Record a baseline first, change the hardware (and update the diagram), then test again against it."}</div>
        ${diffs.length ? `<div class="banner warn" style="margin:8px 0 0">Differs from the baseline: ${diffs.map(esc).join("; ")}. The comparison will flag this.</div>` : ""}

      <div class="card"><h4>Test settings</h4>

        <div class="field"><label>Tune center ${f.center_auto ? "(automatic)" : ""}</label><input data-lf="center_frequency" placeholder="${hz ? MHz(hz - f.sample_rate_hz / 8) + " (1/8 of the rate below, keeps the DC spike out)" : ""}" value="${esc(f.center_frequency)}"></div></div>

          <input data-lf="duration_s" type="number" min="5" max="${o.max_duration_s}" value="${esc(f.duration_s)}" style="width:90px;border:1px solid var(--line);border-radius:7px;padding:4px 7px;background:var(--bg)"> s</div></div>

        <div style="flex:1;min-width:220px;font-size:13px">Records <b>${esc(f.duration_s)} s</b> of IQ at ${MHz(hz)} (about <b>${size(estBytes())}</b>), then analyzes it at low priority. The raw IQ is kept.
          ${o.capabilities.driver === "sdrplay" || o.driver === "sdrplay" ? "" : ""}</div>

  function baselineDiffs(b) {
    const out = [], f = L.form;
    if (Math.abs((freqHz() || 0) - b.frequency_hz) > 1) out.push(`frequency ${MHz(b.frequency_hz)} → ${MHz(freqHz())}`);
    if (Number(f.sample_rate_hz) !== b.sample_rate_hz) out.push("sample rate");
    if (typeof b.gain === "number" && (f.gain_mode !== "manual" || Number(f.gain_db) !== b.gain)) out.push(`gain ${b.gain} dB → ${f.gain_mode === "manual" ? f.gain_db + " dB" : "auto"}`);
    if (Number(f.duration_s) !== b.duration_s) out.push("duration");
    return out;
  }
  function formBody(extra = {}) {
    const f = L.form;
    return {receiver_id: L.rid, frequency: f.frequency, center_frequency: f.center_frequency || null,
            sample_rate_hz: Number(f.sample_rate_hz), gain_mode: f.gain_mode, gain_db: f.gain_mode === "manual" ? Number(f.gain_db) : null,
            ifgr_db: Number(f.ifgr_db), rfgr: Number(f.rfgr), agc: !!f.agc, bandwidth_hz: f.bandwidth_hz ? Number(f.bandwidth_hz) : null,
            gain_elements: L.opts.gain_model === "elements" ? f.gain_elements : null,
            duration_s: Number(f.duration_s), signal_type: f.signal_type, channel_bandwidth_hz: f.channel_bandwidth_hz ? Number(f.channel_bandwidth_hz) : null,
            antenna: L.opts.switched ? f.antenna : null, name: f.name, description: f.description,
            tags: f.tags.split(",").map((x) => x.trim()).filter(Boolean), baseline_test_id: f.baseline_test_id || null,
            ...(L.mode === "interference" ? {test_type: "interference", preset: f.inv_preset} : {}), ...extra};
  }
  async function start() {
    const btn = body().querySelector('[data-lab="start"]');
    if (btn) { btn.disabled = true; btn.textContent = "Starting…"; }
    try {
      const r = await api("/v1/rf/tests", {method: "POST", body: JSON.stringify(formBody())});
      watch(r.test_id);
    } catch (e) {
      toast(e.message);
      body().insertAdjacentHTML("afterbegin", `<div class="banner err" style="margin:0 0 14px">${esc(e.message)}</div>`);
      if (btn) { btn.disabled = false; btn.textContent = L.form.baseline_test_id ? "Test new configuration" : "Record baseline"; }
    }
  }

  // ------------------------------------------------------------------ progress, then results
  async function watch(testId) {
    stopPoll();
    L.testId = testId; L.view = "test"; L.tab = "spectrum"; L.tabAuto = true;     // first result picks its own tab
    const tick = async () => {
      try {
        const d = await api(`/v1/rf/tests/${testId}`);
        L.detail = d;
        const kind = d.test.test_type;
        if (d.progress.done) { stopPoll(); ({scan: renderScanResult, gain_sweep: renderGainResult, satellite: renderSatResult, sat_compare: renderSatCompare, filter_test: renderFilterResult}[kind] || renderResult)(d); } else renderProgress(d);
      } catch (e) { stopPoll(); body().innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
    };
    await tick();
    if (!L.detail.progress.done) L.poll = setInterval(tick, 1500);
  }
  async function openResult(testId) { open("Signal Path Test"); body().innerHTML = `<p class="muted">Loading…</p>`; await watch(testId); }
  const STEPS = [["waiting", "Waiting for the receiver"], ["initializing", "Initializing receiver · configuring tuner"],
                 ["recording", "Recording"], ["processing", "Processing IQ · waterfall · metrics"], ["complete", "Saving results · complete"]];
  function renderProgress(d) {
    const t = d.test, p = d.progress;
    $("lab-title").textContent = `Signal Path Test · ${t.receiver_id} · ${t.name || t.test_id}`;
    const idx = STEPS.findIndex(([k]) => k === p.phase);
    const frac = p.phase === "recording" ? 0.25 + 0.55 * (p.elapsed_s / Math.max(1, p.total_s)) : [0.03, 0.15, 0.25, 0.85, 1][idx] ?? 0.05;
    body().innerHTML = `<div class="card"><h4>Running</h4><div class="big">${esc(p.label)}</div>
      <div class="prog"><div style="width:${Math.round(frac * 100)}%"></div></div>
      <div class="steps">${STEPS.map(([k, l], i) => `<span class="${i < idx ? "done" : i === idx ? "on" : ""}">${i < idx ? "✓ " : ""}${esc(l)}</span>`).join("")}</div>
      <p class="muted" style="font-size:12.5px">You can close this panel; the test keeps running and appears in Test history.</p>
      <button class="btn danger" data-lab="cancel">${p.phase === "recording" ? "Stop recording (keep what was captured)" : "Cancel test"}</button></div>
      <div class="card"><h4>Signal path for this test</h4>${vpath((d.job.rf_path || t.rf_path || {}).chain, t.receiver_id, d.job.switch_port)}</div>`;
  }
  function tile(lbl, val, sub = "") { return `<div class="metric"><div class="lbl">${esc(lbl)}</div><div class="val">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`; }
  function renderResult(d) {
    const t = d.test, j = d.job, m = d.metrics, p = d.progress;

    const r = j.radio || {};

      body().innerHTML = `<div class="card"><h4>${esc(p.phase === "complete" ? "No analysis results" : "Test ended")}</h4><div class="big">${esc(p.label)}</div>
        <p>${esc(j.status_reason || "")}</p><button class="btn" data-lab="again">Set up another test</button></div>`;

    }
    const s = m.summary, ch = s.channel || {};

    body().innerHTML = simBanner + `

          ${t.description ? `<dt>Description</dt><dd>${esc(t.description)}</dd>` : ""}</dl></div>
          <div>${vpath((j.rf_path || t.rf_path || {}).chain, t.receiver_id, j.switch_port)}</div></div>
        <div class="grid3" style="margin-top:12px">
          ${tile("Mean channel power", ch.measured ? num(ch.mean_power_dbfs, 1, "dBFS") : "—", ch.measured ? `${(ch.bandwidth_hz / 1e3).toFixed(1)} kHz at ${MHz(ch.target_frequency_hz)}` : esc(ch.note || ""))}
          ${tile("Estimated noise floor", num(s.noise_floor_dbfs_per_hz, 1, "dBFS/Hz"), `${num(s.noise_floor_dbfs_per_bin, 1)} dBFS per ${s.rbw_hz} Hz bin`)}
          ${tile("Estimated SNR", s.snr_db != null ? num(s.snr_db, 1, "dB") : "unavailable", s.snr_db != null ? "see method below" : esc(ch.snr_unavailable || "no target channel"))}
          ${tile("Digital clipping", pct(s.clipped_fraction), `peak sample ${num((s.peak_sample_fraction_of_full_scale || 0) * 100, 0)}% of full scale`)}
          ${tile("Detected spectral peaks", esc(s.signals_detected), `${s.strong_peaks} strong · ${s.persistent_spurs} persistent narrow`)}
          ${tile("Mean received power", num(s.mean_power_dbfs, 1, "dBFS"), "sample RMS, whole band")}
        </div>
        <div style="margin-top:10px"><b style="font-size:13px">Recording quality</b><ul class="facts" style="font-size:13px;margin:4px 0 0 18px;padding:0">
          ${m.quality.map((q) => `<li><span class="tag ${q.basis === "measured" ? "" : "warn"}">${esc(q.basis)}</span> ${esc(q.text)}</li>`).join("")}</ul></div>
        ${s.snr_db != null ? `<p class="muted" style="font-size:12px">SNR method: ${esc(ch.snr_method)}</p>` : ""}
        <div class="plotbar" style="margin-top:12px">
          <button class="btn small" data-tab="waterfall">View waterfall</button><button class="btn small" data-tab="spectrum">View spectrum</button>

      <div class="card"><div class="tabs">${[...(m.investigation ? [["anomalies", `Anomalies (${m.investigation.anomalies.length})`]] : []), ["spectrum", "Spectrum"], ["waterfall", "Waterfall"], ["power", "Power over time"], ["floor", "Noise floor"], ["signals", `Interference (${m.signals.length})`], ["iq", "IQ diagnostics"], ["images", "Images"], ["notes", "Notes"]].map(([k, l]) => `<button data-tab="${k}" class="${L.tab === k ? "on" : ""}">${esc(l)}</button>`).join("")}</div>

  function renderTab() {

                 {y: m.spectrum.floor_dbfs, color: "var(--ink-2)", width: 1, dash: [4, 3], label: "floor"}],

          <td>${esc(when(t.record_start))}</td><td>${esc(t.receiver_id)}</td><td><span class="tag">${esc({quick: "signal test", scan: "wideband scan", filter_test: "filter test", gain_sweep: "gain sweep", interference: "interference", satellite: "satellite", sat_compare: "pass comparison"}[t.test_type] || t.test_type)}</span> <b>${esc(t.name || t.test_id)}</b><br><span class="muted">${esc(t.path || "")}</span>${t.baseline_test_id ? `<br><span class="tag">vs ${esc(t.baseline_test_id)}</span>` : ""}</td>
          <td class="num">${t.stop_hz ? `${(t.frequency_hz / 1e6).toFixed(1)}–${(t.stop_hz / 1e6).toFixed(1)}` : (t.frequency_hz / 1e6).toFixed(3)}</td><td class="num">${num(t.noise_floor_dbfs_per_hz)}</td><td class="num">${t.snr_db == null ? (t.status === "complete" ? "n/a" : "—") : num(t.snr_db)}</td>
          <td class="num">${t.clipped_fraction == null ? "—" : pct(t.clipped_fraction)}</td><td class="num">${t.strong_peaks ?? "—"}</td>
          <td>${(t.tags || []).map((x) => `<span class="tag">${esc(x)}</span>`).join(" ")}${t.status !== "complete" ? ` <span class="tag warn">${esc(t.status)}</span>` : ""}</td></tr>`).join("") || `<tr><td colspan="10">No tests match.</td></tr>`}
        </table></div></div>`;
  }

  // ------------------------------------------------------------------ A/B comparison
  async function openCompare(a, b) {
    stopPoll(); L.view = "compare";
    open("A/B comparison");
    body().innerHTML = `<p class="muted">Comparing…</p>`;
    let c;
    try { c = await api(`/v1/rf/tests/compare?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`); } catch (e) { body().innerHTML = `<div class="banner err">${esc(e.message)}</div>`; return; }
    L.cmp = c;
    const side = (x, label) => `<div class="card"><h4>${label}</h4><div style="font-weight:650">${esc(x.name || x.test_id)}</div><div class="muted" style="font-size:12.5px">${esc(when(x.record_start))} · ${esc(x.receiver_id)}</div>
      <div style="margin:8px 0">${vpath((label.startsWith("A") ? c.path.a_chain : c.path.b_chain), x.receiver_id, x.switch_port)}</div>
      <dl class="kv"><dt>Frequency</dt><dd>${MHz(x.radio.target_frequency_hz)}</dd><dt>Sample rate</dt><dd>${(x.radio.sample_rate_hz / 1e6).toFixed(3)} MS/s</dd>
      <dt>Gain</dt><dd>${gainText(x.radio)}</dd></dl></div>`;
    const r = c.report;
    const better = (row) => row.change == null || !row.better || row.change === 0 ? "" : ((row.better === "lower") === (row.change < 0) ? "good" : "bad");
    body().innerHTML = `<div class="grid2">${side(c.a, "A · baseline")}${side(c.b, "B · new configuration")}</div>
      <div class="card"><h4>What changed</h4><ul class="facts" style="margin:0 0 0 18px;padding:0;font-size:13px">
        ${c.path.changes.map((x) => `<li>Signal path: ${esc(x)}</li>`).join("") || "<li>Signal path: no recorded change</li>"}
        ${c.settings_differ.map((d) => `<li>${esc(d.setting)}: ${esc(JSON.stringify(d.a))} → ${esc(JSON.stringify(d.b))}</li>`).join("")}
        <li>Time between tests: ${c.time_between_s < 3600 ? Math.round(c.time_between_s / 60) + " min" : (c.time_between_s / 3600).toFixed(1) + " h"}</li></ul></div>
      <div class="card"><h4>Result</h4><div style="font-size:15px;font-weight:650;margin-bottom:8px">${esc(r.verdict)}</div>
        ${r.warnings.map((w) => `<div class="banner warn" style="margin:6px 0">${esc(w)}</div>`).join("")}
        <div class="grid3" style="font-size:13px"><div><b>Measured</b><ul class="facts" style="margin:4px 0 0 18px;padding:0">${r.measured.map((x) => `<li>${esc(x)}</li>`).join("") || "<li>—</li>"}</ul></div>
        <div><b>Interpretation</b><ul class="facts" style="margin:4px 0 0 18px;padding:0">${r.interpretations.map((x) => `<li>${esc(x)}</li>`).join("") || "<li>None beyond the measurements.</li>"}</ul></div>
        <div><b>Not confirmed</b><ul class="facts" style="margin:4px 0 0 18px;padding:0">${r.hypotheses.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
        <div class="plotbar" style="margin-top:10px"><a class="btn small" target="_blank" rel="noopener" href="/v1/rf/tests/${esc(c.b.test_id)}/report?compare_with=${esc(c.a.test_id)}">Download comparison report</a></div></div>
      <div class="card"><h4>Metrics</h4><div style="overflow-x:auto"><table class="t"><tr><th>Metric</th><th class="num">A (before)</th><th class="num">B (after)</th><th class="num">Change</th></tr>
        ${c.metrics.map((m) => `<tr><td>${esc(m.metric)}</td><td class="num">${m.a == null ? "—" : esc(m.a)} ${esc(m.unit)}</td><td class="num">${m.b == null ? "—" : esc(m.b)} ${esc(m.unit)}</td><td class="num ${better(m)}">${m.change == null ? "—" : (m.change > 0 ? "+" : "") + m.change}</td></tr>`).join("")}</table></div>
        <p class="muted" style="font-size:12px">Green and red only show the direction of each number. They are not a verdict on their own.</p></div>
      ${c.overlay ? `<div class="card"><h4>Overlaid spectrum (dBFS/Hz)</h4>${plotBox("c-ov", "overlay")}<div class="legend"><span><i style="background:var(--ink-2)"></i>A baseline</span><span><i style="background:var(--accent)"></i>B new</span></div></div>
      <div class="card"><h4>Difference spectrum (B − A, dB)</h4>${plotBox("c-diff", "difference", 220)}<p class="muted" style="font-size:12px">${esc(c.overlay.units)}. Median difference ${c.overlay.median_diff_db} dB. Below zero: B has less power at that frequency.</p></div>` : `<div class="banner warn">The two tests share no frequency range, so spectra cannot be overlaid.</div>`}
      <div class="card"><h4>Waterfalls (same frequency range and color scale)</h4><div class="grid2"><div><b style="font-size:12.5px">A</b>${plotBox("c-wa", "waterfall-a", 300)}</div><div><b style="font-size:12.5px">B</b>${plotBox("c-wb", "waterfall-b", 300)}</div></div></div>`;
    if (c.overlay) {
      lineChart($("c-ov"), {x: c.overlay.freqs_hz, xFmt: (v) => (v / 1e6).toFixed(4), xLabel: "MHz", yLabel: "dBFS/Hz",
        series: [{y: c.overlay.a_dbfs_per_hz, color: "var(--ink-2)", width: 1.2}, {y: c.overlay.b_dbfs_per_hz, color: "var(--accent)", width: 1.2}]});
      lineChart($("c-diff"), {x: c.overlay.freqs_hz, xFmt: (v) => (v / 1e6).toFixed(4), xLabel: "MHz", yLabel: "dB", series: [{y: c.overlay.diff_db, color: "var(--k-amplifier)", width: 1.2}], hlines: [{y: 0, color: "var(--ink-2)"}]});
    }
    const [lo, hi] = c.waterfalls.shared_scale_dbfs;
    const view = c.overlay ? [c.overlay.freqs_hz[0], c.overlay.freqs_hz[c.overlay.freqs_hz.length - 1]] : null;
    const wa = waterfall($("c-wa"), c.waterfalls.a, {view, target: c.a.radio.target_frequency_hz});
    const wb = waterfall($("c-wb"), c.waterfalls.b, {view, target: c.b.radio.target_frequency_hz});
    const shared = [Math.max(lo, Math.min(wa.st.lo, wb.st.lo)), Math.min(hi, Math.max(wa.st.hi, wb.st.hi))];
    wa.setRange(...shared); wb.setRange(...shared);      // identical color scale on both
  }

  // ------------------------------------------------------------------ component history (part drawer)
  async function partTests(cid) {
    const box = document.getElementById("part-tests");
    if (!box || box.dataset.part !== cid) return;
    let all;
    try { all = (await api("/v1/rf/tests")).tests; } catch { box.textContent = "Test history unavailable."; return; }
    const by = Object.fromEntries(all.map((t) => [t.test_id, t]));
    const mine = all.filter((t) => t.parts.includes(cid));
    if (!document.getElementById("part-tests") || box.dataset.part !== cid) return;
    if (!mine.length) { box.innerHTML = "No signal-path tests have used this part yet."; return; }
    const cmps = all.filter((t) => t.baseline_test_id && by[t.baseline_test_id] && (t.parts.includes(cid) !== by[t.baseline_test_id].parts.includes(cid)));
    const rx = [...new Set(mine.map((t) => t.receiver_id))].join(", ");
    const fr = [...new Set(mine.map((t) => (t.frequency_hz / 1e6).toFixed(3)))].slice(0, 6).join(", ");
    box.innerHTML = `<b>${mine.length} test(s)</b> with this part · receivers ${esc(rx)} · ${esc(fr)} MHz
      <ul style="margin:4px 0 0 18px;padding:0">${mine.slice(0, 5).map((t) => `<li><a href="#" data-open-test="${esc(t.test_id)}">${esc(t.name || t.test_id)}</a> · ${esc(when(t.record_start))} · floor ${num(t.noise_floor_dbfs_per_hz)} dBFS/Hz · SNR ${t.snr_db == null ? "n/a" : num(t.snr_db) + " dB"}</li>`).join("")}</ul>
      ${cmps.length ? `<b>Comparisons where this part was added or removed:</b><ul style="margin:4px 0 0 18px;padding:0">${cmps.slice(0, 5).map((t) => { const b = by[t.baseline_test_id], added = t.parts.includes(cid); return `<li><a href="#" data-compare="${esc(b.test_id)}|${esc(t.test_id)}">${added ? "added" : "removed"} · ${esc(when(t.record_start))}</a>: SNR ${b.snr_db == null ? "n/a" : num(b.snr_db)} → ${t.snr_db == null ? "n/a" : num(t.snr_db)} dB, floor ${num(b.noise_floor_dbfs_per_hz)} → ${num(t.noise_floor_dbfs_per_hz)} dBFS/Hz</li>`; }).join("")}</ul>` : ""}`;
  }

  // ------------------------------------------------------------------ after a layout save

    const rids = Object.keys(S.data?.receiver_info || {});

  function offerBanner() {
    if (!L.offer.length) return "";
    return `<div class="banner warn" style="color:var(--ink)">Signal path changed on ${L.offer.map(esc).join(", ")}. Test this configuration? ${L.offer.map((r) => `<button class="btn small" data-test-rx="${esc(r)}">Test ${esc(r)}${S.data && (L.tests || []).length ? "" : ""}</button>`).join(" ")} <span class="muted">(compares against its last test, if there is one)</span> <button class="btn small" data-lab="dismiss-offer">Not now</button></div>`;
  }

  // ------------------------------------------------------------------ events inside the lab
  $("lab").addEventListener("click", async (e) => {
    const t = e.target;
    const tab = t.closest("[data-tab]");
    if (tab) { L.tab = tab.dataset.tab; renderTab(); return; }
    const png = t.closest("[data-png]");
    if (png) { const cv = $(png.dataset.png); const a = document.createElement("a"); a.download = `${L.detail?.test?.test_id || "compare"}-${cv.dataset.name}.png`; a.href = cv.toDataURL("image/png"); a.click(); return; }
    const dur = t.closest("[data-dur]");
    if (dur) { L.form.duration_s = Number(dur.dataset.dur); renderForm(); return; }
    const sig = t.closest("[data-sig]");
    if (sig) { L.tab = "spectrum"; renderTab(); const f = Number(sig.dataset.sig), span = 50e3; L.charts.spec.st.view = [f - span, f + span]; L.charts.spec.draw(); return; }
    const pick = t.closest("[data-pick]");
    if (pick) {
      e.stopPropagation();
      const id = pick.dataset.pick;
      L.sel = pick.checked ? [...L.sel.filter((x) => x !== id), id].slice(-2) : L.sel.filter((x) => x !== id);
      body().querySelectorAll("[data-pick]").forEach((c) => { c.checked = L.sel.includes(c.dataset.pick); });
      const b = body().querySelector('[data-lab="compare-sel"]'); if (b) b.disabled = L.sel.length !== 2;
      return;
    }
    const ot = t.closest("[data-open-test]");
    if (ot && !t.closest("input")) { e.preventDefault(); return openResult(ot.dataset.openTest); }
    const a = t.closest("[data-lab]")?.dataset.lab;
    if (!a) return;
    if (a === "start") return start();
    if (a === "recheck") return openTest(L.rid, L.form?.baseline_test_id || null);
    if (a === "cancel") { try { const r = await api(`/v1/rf/tests/${L.testId}/cancel`, {method: "POST", body: "{}"}); toast(r.note || r.status || "Cancelled"); } catch (err) { toast(err.message); } return; }
    if (a === "again") return openTest(L.detail.test.receiver_id, L.detail.test.test_id);
    if (a === "compare-baseline") return openCompare(L.detail.test.baseline_test_id, L.detail.test.test_id);
    if (a === "compare-sel") {
      const [x, y] = L.sel, types = L.sel.map((id) => (L.histList || []).find((r) => r.test_id === id)?.test_type);
      if (types[0] !== types[1]) { toast("Pick two tests of the same kind to compare"); return; }
      return types[0] === "scan" ? openScanCompare(x, y) : openCompare(x, y);
    }
    if (a === "hist-apply") { body().querySelectorAll("[data-hf]").forEach((i) => { L.filters[i.dataset.hf] = i.value.trim(); }); return renderHistory(); }
    if (a === "iq-link") { try { const r = await api(`/v1/rf/tests/${L.detail.test.test_id}/iq-link`, {method: "POST", body: "{}"}); window.open(r.url, "_blank", "noopener"); } catch (err) { toast(err.message); } return; }
    if (a === "save-notes") {
      try { await api(`/v1/rf/tests/${L.detail.test.test_id}`, {method: "POST", body: JSON.stringify({name: $("n-name").value, notes: $("n-notes").value, tags: $("n-tags").value.split(",").map((x) => x.trim()).filter(Boolean)})}); toast("Notes saved"); await watch(L.detail.test.test_id); L.tab = "notes"; renderTab(); } catch (err) { toast(err.message); }
      return;
    }
    if (a === "save-preset") {
      const nm = (L.form.name || "").trim();      // no browser dialogs: the test name field names the preset
      if (!nm) { toast("Type a test name first; it becomes the preset's name"); return; }
      const b = formBody();
      try { await api("/v1/rf/tests/presets", {method: "POST", body: JSON.stringify({name: nm, receiver_id: null, params: b})}); toast(`Preset “${nm}” saved`); L.opts.presets = (await api(`/v1/rf/tests/presets?receiver_id=${encodeURIComponent(L.rid)}`)).presets; renderForm(); } catch (err) { toast(err.message); }
      return;
    }
  });
  $("lab").addEventListener("change", (e) => {
    const t = e.target;
    if (t.matches("[data-pick]")) return;
    const k = t.dataset.lf;
    if (!k || !L.form) return;
    if (k.startsWith("ge:")) L.form.gain_elements[k.slice(3)] = Number(t.value);
    else if (k === "gain_sel") { if (t.value === "auto") L.form.gain_mode = "auto"; else { L.form.gain_mode = "manual"; L.form.gain_db = Number(t.value); } }
    else if (k === "agc") L.form.agc = t.checked;
    else if (k === "baseline_test_id") { L.form.baseline_test_id = t.value || null; if (t.value) applyBaseline(t.value); }
    else if (k === "preset") {
      const p = L.opts.presets.find((x) => x.preset_id === t.value);
      if (p) { const q = p.params; Object.assign(L.form, {frequency: q.frequency ?? L.form.frequency, center_frequency: q.center_frequency || "", sample_rate_hz: q.sample_rate_hz ?? L.form.sample_rate_hz,
        gain_mode: q.gain_mode ?? L.form.gain_mode, gain_db: q.gain_db ?? L.form.gain_db, ifgr_db: q.ifgr_db ?? L.form.ifgr_db, rfgr: q.rfgr ?? L.form.rfgr, agc: q.agc ?? L.form.agc,
        bandwidth_hz: q.bandwidth_hz ?? L.form.bandwidth_hz, duration_s: q.duration_s ?? L.form.duration_s, signal_type: q.signal_type ?? L.form.signal_type,
        channel_bandwidth_hz: q.channel_bandwidth_hz || "", tags: (q.tags || []).join(", ")}); toast(`Preset “${p.name}” applied`); }
    } else L.form[k] = t.value;
    if (k === "center_frequency") L.form.center_auto = !t.value;
    renderForm();
  });
  // ================================================================== Wideband RF scan
  const SCAN_RES = [["auto", "Auto"], ["coarse", "Coarse (50 kHz)"], ["medium", "Medium (10 kHz)"], ["fine", "Fine (2 kHz)"], ["custom", "Custom…"]];
  const SCAN_MODES = [["average", "Average spectrum"], ["peak", "Peak hold"], ["repeated", "Repeated sweep (heatmap)"], ["filter", "Filter comparison"]];
  async function openScan(rid, baselineId) {
    stopPoll();
    L.rid = rid; L.view = "scanform";
    open(`Wideband RF Scan · ${rid}`);
    body().innerHTML = `<p class="muted">Loading ${esc(rid)}…</p>`;
    try {
      const [o, h] = await Promise.all([api(`/v1/rf/tests/options/${encodeURIComponent(rid)}`),
                                        api(`/v1/rf/tests?receiver=${encodeURIComponent(rid)}&test_type=scan`)]);
      L.opts = o; L.scans = h.tests;
      const d = o.defaults;
      L.sf = {start: "80", stop: "160", resolution: "auto", custom_res: "", dwell_s: 0.25, sample_rate_hz: o.driver === "rtlsdr" ? 2400000 : 2000000,
              gain_mode: d.gain_mode || "manual", gain_db: d.gain_db, ifgr_db: d.ifgr_db ?? 40, rfgr: d.rfgr ?? 4, agc: false,
              bandwidth_hz: d.bandwidth_hz || 1536000, scan_mode: "average", repeats: 5,
              regions: [{name: "FM broadcast", start: "88", stop: "108", role: "stop"}],
              antenna: d.antenna || Object.values(o.switch_ports)[0] || "", name: "", description: "", tags: "",
              baseline_test_id: baselineId || null, advanced: false};
      if (baselineId) {
        const b = L.scans.find((t) => t.test_id === baselineId);
        if (b) Object.assign(L.sf, {start: String(b.frequency_hz / 1e6), stop: String(b.stop_hz / 1e6)});   // same range as "before"
      }
      renderScanForm(); scanEstimate();
    } catch (e) { body().innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  }
  function scanBody(extra = {}) {
    const f = L.sf;
    return {receiver_id: L.rid, test_type: "scan", start: f.start, stop: f.stop,
            resolution: f.resolution === "custom" ? Number(f.custom_res) : f.resolution, dwell_s: Number(f.dwell_s),
            sample_rate_hz: Number(f.sample_rate_hz), gain_mode: f.gain_mode, gain_db: f.gain_mode === "manual" ? Number(f.gain_db) : null,
            ifgr_db: Number(f.ifgr_db), rfgr: Number(f.rfgr), agc: !!f.agc, bandwidth_hz: Number(f.bandwidth_hz),
            scan_mode: f.scan_mode, repeats: f.scan_mode === "repeated" ? Number(f.repeats) : 1,
            regions: f.regions.filter((r) => r.start && r.stop).map((r) => ({name: r.name, start_hz: r.start, stop_hz: r.stop, role: r.role})),
            antenna: L.opts.switched ? f.antenna : null, name: f.name, description: f.description,
            tags: f.tags.split(",").map((x) => x.trim()).filter(Boolean), baseline_test_id: f.baseline_test_id || null, ...extra};
  }
  let estTimer = null, estSeq = 0;
  function scanEstimate() {
    clearTimeout(estTimer);
    const seq = ++estSeq;
    const box0 = $("scan-est"); if (box0) box0.classList.add("muted");
    const b0 = body().querySelector('[data-scan="start"]'); if (b0) b0.disabled = true;      // until this estimate is back
    estTimer = setTimeout(async () => {
      const box = $("scan-est");
      if (!box) return;
      try {
        const p = await api("/v1/rf/tests/scan-plan", {method: "POST", body: JSON.stringify(scanBody())});
        if (seq !== estSeq) return;                                  // a newer estimate is on its way
        L.splan = p;
        const t = p.estimated_seconds;
        box.innerHTML = `<b>${p.steps}</b> tuning steps${p.repeats > 1 ? ` × ${p.repeats} sweeps` : ""} · resolution <b>${p.rbw_hz} Hz</b> (FFT ${p.nfft}) · step ${(p.stride_hz / 1e6).toFixed(3)} MHz<br>
          Estimated scan time <b>${t < 90 ? Math.round(t) + " s" : (t / 60).toFixed(1) + " min"}</b> (receiver reserved ${p.reserved_seconds} s) · about <b>${size(p.estimated_bytes)}</b> of raw IQ kept
          ${p.availability.available ? `<div class="good" style="margin-top:4px">Receiver is free.</div>` : `<div class="bad" style="margin-top:4px">${p.availability.reasons.map(esc).join("<br>")}</div>`}`;
        const b = body().querySelector('[data-scan="start"]'); if (b) b.disabled = !p.availability.available;
      } catch (e) { if (seq !== estSeq) return; box.innerHTML = `<span class="bad">${esc(e.message)}</span>`; const b = body().querySelector('[data-scan="start"]'); if (b) b.disabled = true; }
    }, 300);
  }
  function renderScanForm() {
    const o = L.opts, f = L.sf;
    const port = o.switched ? Object.entries(o.switch_ports).find(([, a]) => a === f.antenna)?.[0] : null;
    const chain = o.chain.slice();
    if (o.switched && f.antenna) chain.splice(1, 0, {kind: "antenna", name: f.antenna, via_port: port});
    const rates = o.driver === "rtlsdr" ? RTL_RATES.filter((r) => r >= 1e6) : SDR_RATES.filter((r) => r >= 2e6);
    const gain = o.driver === "rtlsdr" ? `<div class="field"><label>Tuner gain (same for every step)</label><select data-sf="gain_sel">

  function renderHosts() {

  function readHostForm() {
    const box = body().querySelector("[data-host-add]");

  $("lab").addEventListener("click", async (e) => {

    try {
      if (act === "reload") return openHosts();

  // ================================================================== Settings: versioned, validated, exportable
  const CFG_DRAFT = "aobs.settings.draft.v1";
  const cfgDocs = () => (L.cfg ? L.cfg.documents : {});
  const cfgDirty = (doc) => L.cfgEdit && L.cfgEdit[doc] && JSON.stringify(L.cfgEdit[doc]) !== JSON.stringify(cfgDocs()[doc]?.current?.data);
  function settingsDirty() { return !!L.cfg && Object.keys(cfgDocs()).some(cfgDirty); }
  function cfgWriteDraft() {
    try {
      const d = {};
      for (const doc of Object.keys(cfgDocs())) if (cfgDirty(doc)) d[doc] = {base: cfgDocs()[doc].current?.version, data: L.cfgEdit[doc]};
      if (Object.keys(d).length) localStorage.setItem(CFG_DRAFT, JSON.stringify({at: new Date().toISOString(), docs: d}));
      else localStorage.removeItem(CFG_DRAFT);
    } catch (e) {}
  }
  async function openSettings() {
    stopPoll(); L.view = "settings";
    open("Settings");

    try { L.cfg = await api("/v1/config"); } catch (e) { body().innerHTML = `<div class="banner err">${esc(e.message)}</div>`; return; }
    L.cfgEdit = {}; L.cfgErr = {}; L.cfgNote = {}; L.cfgRestored = null;
    for (const [doc, d] of Object.entries(cfgDocs())) L.cfgEdit[doc] = clone(d.current?.data || {});
    try {
      const dr = JSON.parse(localStorage.getItem(CFG_DRAFT) || "null");
      if (dr) for (const [doc, x] of Object.entries(dr.docs || {})) if (L.cfgEdit[doc]) {
        L.cfgEdit[doc] = {...L.cfgEdit[doc], ...x.data};
        if (cfgDirty(doc)) L.cfgRestored = {at: dr.at, newer: (L.cfgRestored?.newer || []).concat(x.base !== cfgDocs()[doc].current?.version ? [cfgDocs()[doc].label] : [])};
      }

    loadBackups();
    loadIntegrations();

  // ---------------------------------------------------------------- Slack and Google Calendar setup

  function loadIntegrations() {
    const sl = body().querySelector("[data-slack-card]"), cal = body().querySelector("[data-cal-card]");
    if (!sl || !cal) return;
    if (!window.StarlabIntegrations) {
      const m = `<div class="banner err" style="margin:0">The broker is running older code than this page. Restart it to set up integrations here.</div>`;
      sl.innerHTML = m; cal.innerHTML = m; return;
    }
    const refreshDoc = (doc) => async () => {
      L.cfg.documents[doc] = await api(`/v1/config/${doc}`); L.cfgEdit[doc] = clone(L.cfg.documents[doc].current.data); refreshCard(doc);
    };
    StarlabIntegrations.mountSlack(sl, {api, onSlackDoc: refreshDoc("slack")});
    const c = StarlabIntegrations.mountCalendar(cal, {api});
    cal.addEventListener("click", (e) => {        // turning the calendar on or off saves the Integrations document
      const a = e.target.closest("[data-sc]");
      if (a && ["enable", "disable"].includes(a.dataset.sc)) setTimeout(() => refreshDoc("integrations")().catch(() => {}), 1500);
    });
    return c;
  }
  function fieldInput(doc, f, v) {
    const id = `cf-${doc}-${f.key}`;
    const attr = `id="${id}" data-cf="${esc(doc)}" data-cfk="${esc(f.key)}"`;
    let input;
    if (f.kind === "bool") input = `<label style="font-weight:400"><input type="checkbox" ${attr} ${v ? "checked" : ""}> ${esc(f.label)}</label>`;
    else if (f.kind === "kinds") input = `<div class="cfkinds">${f.choices.map((k) => `<label style="font-weight:400;white-space:nowrap;display:inline"><input type="checkbox" data-cf="${esc(doc)}" data-cfk="${esc(f.key)}" data-kind="${esc(k)}" ${(v || []).includes(k) ? "" : "checked"}> ${esc(k.replace(/_/g, " "))}</label>`).join("")}</div>`;
    else if (f.kind === "int" || f.kind === "float") input = `<input type="number" ${attr} ${f.min != null ? `min="${f.min}"` : ""} ${f.max != null ? `max="${f.max}"` : ""} step="${f.kind === "int" ? 1 : "any"}" value="${v ?? ""}" ${f.nullable ? `placeholder="not set"` : ""}>`;
    else input = `<input ${attr} value="${esc(v ?? "")}" ${f.kind === "tz" ? `list="tz-list"` : ""} ${f.nullable ? `placeholder="not set"` : ""}>`;
    const label = f.kind === "bool" ? "" : `<label for="${id}">${esc(f.kind === "kinds" ? "Send to Slack" : f.label)}${f.applies === "restart" ? ` <span class="tag">applies after a broker restart</span>` : ""}</label>`;
    return `<div class="field">${label}${input}${f.kind === "bool" && f.applies === "restart" ? ` <span class="tag">applies after a broker restart</span>` : ""}${f.help ? `<div class="muted" style="font-size:12px;margin-top:3px">${esc(f.help)}</div>` : ""}</div>`;
  }
  function docCard(doc, d) {
    const cur = d.current || {}, dirtyNow = cfgDirty(doc), errs = L.cfgErr[doc] || [], note = L.cfgNote[doc];
    return `<div class="card" data-cfg-doc="${esc(doc)}"><div class="rxh" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h4 style="margin:0">${esc(d.label)}</h4>
        ${dirtyNow ? `<span class="pill">Unsaved changes</span>` : ""}<span class="muted" style="font-size:12px">version ${esc(cur.version)} · saved ${esc(when(cur.saved_at))} by ${esc(cur.author || "")}</span></div>
      <p class="muted" style="font-size:12.5px;margin:4px 0 10px">${esc(d.description)}</p>
      ${d.toml_differs.length ? `<div class="banner warn" style="margin:0 0 10px">observatory.toml says something else for ${d.toml_differs.map((x) => `${esc(x.key)} (file: ${esc(JSON.stringify(x.file))})`).join(", ")}. The value saved here is the one in use.</div>` : ""}
      ${errs.length ? `<div class="banner err" style="margin:0 0 10px"><b>Not saved.</b><ul>${errs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      ${note ? `<div class="banner" style="margin:0 0 10px;background:var(--ok-bg);color:var(--ok)">${note}</div>` : ""}
      ${d.fields.map((f) => fieldInput(doc, f, L.cfgEdit[doc][f.key])).join("")}
      <div class="addrow"><button class="btn small primary" data-cfg-act="save" ${dirtyNow ? "" : "disabled"}>Save</button><button class="btn small" data-cfg-act="cancel" ${dirtyNow ? "" : "disabled"}>Cancel</button>
        <button class="btn small" data-cfg-act="history">History</button></div>
      <div data-cfg-hist></div></div>`;

  function renderSettings() {
    const v = L.cfg, m = v.managed, b = v.bootstrap;
    const tzs = (Intl.supportedValuesOf ? Intl.supportedValuesOf("timeZone") : []).map((z) => `<option value="${esc(z)}">`).join("");

      ${L.cfgRestored ? `<div class="banner warn" style="margin:0 0 12px">Unsaved settings from ${esc(when(L.cfgRestored.at))} were restored in this browser. ${L.cfgRestored.newer.length ? `Someone saved ${esc(L.cfgRestored.newer.join(", "))} since then; check before saving.` : ""} Save them, or Cancel to drop them.</div>` : ""}
      <div class="card" style="margin-bottom:12px"><h4>Hardware</h4><p style="font-size:13px;margin:4px 0 8px"><b>Receiver hosts</b>: this computer and remote Linux computers Starlab reaches over SSH (key login only). <b>Receivers</b>: the devices discovered on them, what their tools report, and the receivers Starlab controls.</p>

      <h4 class="sect">Integrations</h4>
      <div class="grid2"><div class="card" data-cal-card><p class="muted" style="font-size:12.5px">Loading…</p></div>
        <div class="card" data-slack-card><p class="muted" style="font-size:12.5px">Loading…</p></div></div>
      <h4 class="sect">Also persisted, edited elsewhere</h4>
      <div class="grid2">
        <div class="card"><h4>${esc(m.signal_paths.label)}</h4><p style="font-size:13px">Version ${esc(m.signal_paths.version)}, saved ${esc(when(m.signal_paths.saved_at))}. Edit in the diagram; History at the top has every version.</p></div>
        <div class="card"><h4>${esc(m.receivers.label)}</h4><p style="font-size:13px">${m.receivers.count} receiver(s), ${m.receivers.from_web} added on this page. <button class="btn small" data-cfg-act="receivers">Open Receivers</button></p></div>
        <div class="card"><h4>${esc(m.manual_jobs.label)}</h4><p style="font-size:13px">${esc(m.manual_jobs.note)}.</p></div>
        <div class="card"><h4>${esc(m.scheduling.label)}</h4><p class="muted" style="font-size:12.5px">In ${esc(m.scheduling.edit)}: ${esc(m.scheduling.note)}.</p><table class="t"><tr><th>Receiver</th><th>Mode</th><th>Automatic</th><th>Satellites (NORAD)</th></tr>${rules}</table></div>
      </div>
      <h4 class="sect">Export, import and backups</h4>
      <div class="grid2">
        <div class="card"><h4>Configuration file</h4><p style="font-size:13px">Settings, signal paths and receivers added here, as one JSON file. No credentials, no recordings.</p>
          <div class="addrow"><button class="btn small primary" data-cfg-act="export">Download export</button><label class="btn small" style="cursor:pointer">Import a file…<input type="file" accept=".json,application/json" data-cfg-file hidden></label></div>
          <div data-cfg-import></div></div>
        <div class="card"><h4>Database backups</h4><p style="font-size:13px">A full copy of the database (configuration, schedule, test history). Taken automatically before every upgrade.</p>
          <div class="addrow"><button class="btn small" data-cfg-act="backup">Back up now</button></div><div data-cfg-backups class="muted" style="font-size:12.5px;margin-top:8px">Loading…</div>
          <p class="muted" style="font-size:12px">Restoring replaces the whole database, so it is done on the server with the broker stopped: <code>aobs db list</code>, then <code>aobs db restore &lt;file&gt; --yes</code>.</p></div>
        <div class="card"><h4>First-run setup</h4><p style="font-size:13px">Walk through the setup steps again. Nothing is reset: each step shows the current values.</p><button class="btn small" data-cfg-act="setup">Open the setup wizard</button></div>
        <div class="card"><h4>Bootstrap (observatory.toml)</h4><dl class="kv"><dt>Config file</dt><dd>${esc(b.config_file)}</dd><dt>Data</dt><dd>${esc(b.data_root)}</dd><dt>Database</dt><dd>${esc(b.database)} (schema ${esc(b.schema_version)})</dd><dt>Listens on</dt><dd>${esc(b.listen)}</dd></dl><p class="muted" style="font-size:12px">${esc(b.note)}.</p></div>
      </div>`;
  }
  async function loadBackups() {
    const box = body().querySelector("[data-cfg-backups]");
    if (!box) return;
    try { const r = await api("/v1/config/backups"); box.innerHTML = r.backups.length ? `<table class="t">${r.backups.slice(0, 8).map((x) => `<tr><td>${esc(when(x.created_at))}</td><td>${esc(x.file)}</td><td class="num">${(x.bytes / 1e6).toFixed(1)} MB</td></tr>`).join("")}</table>` : "No backups yet."; }
    catch (e) { box.textContent = e.message; }
  }
  function refreshCard(doc) {
    const card = body().querySelector(`[data-cfg-doc="${doc}"]`);
    if (!card) return;

    card.replaceWith(tmp.firstElementChild);

  function importPlan(r) {
    const docs = Object.entries(r.settings || {}).map(([doc, x]) => `<li><b>${esc(cfgDocs()[doc]?.label || doc)}</b>: ${x.ok === false ? `<span class="bad">${esc((x.errors || []).join("; "))}</span>` : (x.changes || []).length ? esc(x.changes.join("; ")) : "no change"}</li>`).join("");
    const sp = r.signal_paths ? `<li><b>Signal paths</b>: ${r.signal_paths.ok === false ? `<span class="bad">${esc(r.signal_paths.errors.join("; "))}</span>` : r.signal_paths.unchanged ? "no change" : "replaced by the file's layout"}</li>` : "";

    return `<div class="banner ${r.ok ? "" : "err"}" style="margin:10px 0 0;${r.ok ? "background:var(--unk-bg);color:var(--ink)" : ""}"><b>${r.dry_run ? (r.ok ? "Preview: nothing has been changed yet" : "This file cannot be imported; nothing was changed") : "Imported"}</b>
      <ul>${docs}${sp}${rx}</ul>${r.applied ? `<div>${esc(r.applied.join("; ") || "Everything already matched.")}</div>` : ""}
      ${r.dry_run && r.ok ? `<button class="btn small primary" data-cfg-act="import-apply">Apply this import</button>` : ""}</div>`;
  }
  $("lab").addEventListener("input", (e) => {
    const t = e.target, doc = t.dataset?.cf;

    const f = cfgDocs()[doc].fields.find((x) => x.key === t.dataset.cfk);
    let v;
    if (f.kind === "kinds") { const off = [...body().querySelectorAll(`[data-cf="${doc}"][data-cfk="${f.key}"]`)].filter((c) => !c.checked).map((c) => c.dataset.kind); v = off.sort(); }
    else if (f.kind === "bool") v = t.checked;
    else if (f.kind === "int" || f.kind === "float") v = t.value === "" ? (f.nullable ? null : "") : Number(t.value);
    else v = t.value;
    L.cfgEdit[doc][f.key] = v; L.cfgErr[doc] = []; L.cfgNote[doc] = null;

  $("lab").addEventListener("change", async (e) => {

    } catch (err) { box.innerHTML = `<div class="banner err" style="margin:10px 0 0">${esc(err.message)}</div>`; }

  });
  $("lab").addEventListener("click", async (e) => {
    const a = e.target.closest("[data-cfg-act]");
    if (!a) return;

  window.addEventListener("resize", () => { if (L.view === "test" && L.detail?.metrics) renderTab(); });
  // ================================================================== Scheduler (brief 6)

  const SC = {tab: "calendar", ov: null, week: 0, f: {sat: "", rx: "", states: []}, cal: null, hist: null,

                     SKIPPED: "warn", CANCELLED: "", FAILED: "fault"};
  const STATE_HELP = {PREDICTED: "a rule would record this; nothing is booked (Scheduling is manual)",
                      SCHEDULED: "booked; the receiver is reserved for it", RESERVED: "the receiver is being prepared",
                      RECORDING: "recording now", PROCESSING: "recorded; checking and decoding the output",
                      COMPLETED: "the output was validated", SKIPPED: "not recorded (see the reason)",

                     hybrid: "Hybrid: enabled rules book their passes, and your changes to any recording are kept."};
  const tzName = () => (SC.ov && SC.ov.timezone) || "UTC";
  function tfmt(iso, opts) { if (!iso) return ""; try { return new Date(iso).toLocaleString(undefined, {timeZone: tzName(), ...opts}); } catch (e) { return iso; } }
  const tDay = (iso) => tfmt(iso, {weekday: "short", month: "short", day: "numeric"});

  function tzParts(iso) {

  function scExecution(x) {

  function scChanges() {
    const j = SC.job, c = SC.change, out = {};
    if (c.start !== localInput(j.record_start)) out.start = c.start;

    if (c.receiver_id !== j.receiver_id) out.receiver_id = c.receiver_id;

  function withOffset(local) {
    // the UTC instant whose wall-clock time in the display zone is `local` (DST-safe: two passes)
    const s = local.length === 16 ? local + ":00" : local;
    let t = Date.parse(s + "Z");
    for (let i = 0; i < 2; i++) { const p = tzParts(new Date(t).toISOString()); const shown = Date.parse(`${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}Z`); t += Date.parse(s + "Z") - shown; }
    return new Date(t).toISOString();
  }

  // ---------------------------------------------------------------- events

      if (act === "back") { SC.job = null; SC.change = null; return scTab(SC.tab); }
      if (act === "change") { const j = SC.job; SC.change = {start: localInput(j.record_start), end: localInput(j.record_end), receiver_id: j.receiver_id, sample_rate_hz: j.sample_rate_hz ?? "", gain_profile: "", format: j.format, nodecode: false, note: ""}; return scRender(); }
      if (act === "change-cancel") { SC.change = null; return scRender(); }

        const r = await api(`/v1/scheduler/jobs/${encodeURIComponent(SC.job.job_id)}/change`, {method: "POST", body: JSON.stringify({changes, dry_run: act === "change-check"})});
        if (act === "change-check") { SC.change.msg = "This change can be booked." + ((r.warnings || []).length ? " Warnings: " + r.warnings.join("; ") : ""); SC.change.ok = true; return scRender(); }
        toast("Recording changed"); return scOpenJob(SC.job.job_id);
      }
      if (act === "skip") {
        if (!a.dataset.armed) { a.dataset.armed = "1"; a.textContent = "Click again to confirm"; return; }
        await api(`/v1/scheduler/jobs/${encodeURIComponent(SC.job.job_id)}/cancel`, {method: "POST", body: JSON.stringify({reason: ""})}); toast("Skipped"); return scOpenJob(SC.job.job_id);
      }
      if (act === "revert") { await api(`/v1/scheduler/jobs/${encodeURIComponent(SC.job.job_id)}/revert`, {method: "POST", body: "{}"}); toast("Handed back to the rule"); return scOpenJob(SC.job.job_id); }
      if (act === "form-clear") { SC.form = scBlankForm(); return scRender(); }

        SC.form.msg = null; scRxChanged(); return scRender();
      }
      if (act === "book" || act === "book-check") {
