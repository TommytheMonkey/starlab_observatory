[project]
name = "autonomous-observatory"
version = "0.1.0"
description = "Autonomous Radio Observatory: satellite operations, calendar sync and RF discovery"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "skyfield>=1.48",
    "sgp4>=2.22",
    "matplotlib>=3.8",                # waterfall/spectrum plots and test reports
    "pillow>=10",
    # Optional, from the OS when present (the installer creates the venv with --system-site-packages):
    # SoapySDR Python bindings (python3-soapysdr), rtl-sdr tools, SatDump.
]

[project.scripts]
aobs = "aobs.cli:main"
starlab = "aobs.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aobs = ["assets/*", "web/*.html", "scheduling/*.html", "satellites/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
